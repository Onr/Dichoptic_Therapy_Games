name: Validate static therapy site

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint JavaScript
        run: npm run lint
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Game smoke tests
        run: node scripts/smoke_games.js
      - name: Dependency audit
        run: npm audit --audit-level=high
