<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="manifest" href="manifest.json">
  <title>משחק – לחצו על הכדורים הסטטיים</title>
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
      color: #fff; 
    }
    #gameCanvas { 
      display: block; 
      background: #000000; 
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
    }
    #message {
      position: absolute;
      top: 80px;
      right: 20px;
      font: 700 24px 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, rgba(42, 82, 152, 0.95), rgba(30, 60, 114, 0.95));
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    
    #colorBar {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 40px;
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }
    
    #colorBarFill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, 
        #ff0000 0%, 
        #ff8800 20%, 
        #ffff00 40%, 
        #88ff00 60%, 
        #00ff00 80%, 
        #00ff88 100%);
      border-radius: 18px;
      transition: width 0.1s ease-out, transform 0.1s ease-out;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
    }
    
    @keyframes pulse {
      from { box-shadow: 0 0 30px rgba(0, 255, 0, 0.8); }
      to { box-shadow: 0 0 50px rgba(0, 255, 0, 1), 0 0 80px rgba(0, 255, 0, 0.5); }
    }
    
    #colorBarLabel {
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      font: 600 14px 'Segoe UI', sans-serif;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
    }
    #controls {
      position: absolute;
      top: 20px;
      left: 20px;
      background: linear-gradient(135deg, rgba(42, 82, 152, 0.95), rgba(30, 60, 114, 0.95));
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      min-width: 200px;
    }
    
    .controls-header {
      padding: 1rem 1.5rem;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(42, 82, 152, 0.95), rgba(30, 60, 114, 0.95));
      border-radius: 16px 16px 0 0;
      transition: all 0.3s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #e0e6ff;
      font-weight: 600;
      user-select: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .controls-header:hover {
      background: linear-gradient(135deg, rgba(52, 92, 162, 0.95), rgba(40, 70, 124, 0.95));
    }
    
    .controls-header.collapsed {
      border-radius: 16px;
      border-bottom: none;
    }
    
    .controls-toggle {
      font-size: 1.2rem;
      transition: transform 0.3s ease;
      color: #e0e6ff;
    }
    
    .controls-header.collapsed .controls-toggle {
      transform: rotate(-90deg);
    }
    
    .controls-content {
      overflow: hidden;
      transition: max-height 0.3s ease-out, padding 0.3s ease-out;
      max-height: 1000px;
      padding: 20px;
    }
    
    .controls-content.collapsed {
      max-height: 0;
      padding: 0 20px;
    }
    .control-group {
      margin-bottom: 20px;
    }
    .control-group:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
      color: #e0e6ff;
    }
    
    /* Modern Slider Styling */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
      outline: none;
      margin: 8px 0;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(79, 172, 254, 0.3);
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      transition: all 0.3s ease;
    }
    
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    
    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      transition: all 0.3s ease;
    }
    
    /* Modern Button Styling */
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      font-family: 'Segoe UI', sans-serif;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      width: 100%;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      background: linear-gradient(135deg, #5a6fd8 0%, #6b42a6 100%);
    }
    
	    button:active {
	      transform: translateY(0);
	      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
	    }

	    #navButtons {
	      position: absolute;
	      inset-block-end: 20px;
	      inset-inline-start: 20px;
	      z-index: 3;
	      display: flex;
	      gap: 10px;
	    }

	    #navButtons button {
	      width: auto;
	      margin: 0;
	    }

	    /* Completion Modal */
	    #completionModal {
	      position: fixed;
	      top: 0;
	      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .modal-content {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.3);
      max-width: 400px;
      animation: modalAppear 0.5s ease-out;
    }

    @keyframes modalAppear {
      from {
        transform: scale(0.5) rotate(10deg);
        opacity: 0;
      }
      to {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    .modal-title {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .modal-time {
      font-size: 48px;
      font-weight: bold;
      color: #00ff88;
      margin: 20px 0;
      text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
    }

    .modal-message {
      font-size: 18px;
      margin-bottom: 30px;
      color: #e0e6ff;
    }

    .modal-button {
      background: linear-gradient(135deg, #00ff88 0%, #00cc66 100%);
      color: #000;
      border: none;
      padding: 15px 30px;
      border-radius: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin: 0 10px;
      transition: all 0.3s ease;
      box-shadow: 0 5px 20px rgba(0, 255, 136, 0.3);
    }

    .modal-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(0, 255, 136, 0.5);
    }

    /* Leaderboard Modal */
    #leaderboardModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .leaderboard-content {
      background: linear-gradient(135deg, rgba(42, 82, 152, 0.95), rgba(30, 60, 114, 0.95));
      padding: 30px;
      border-radius: 20px;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .leaderboard-title {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      color: #fff;
    }

    .leaderboard-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      margin: 10px 0;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      border-left: 4px solid #00ff88;
    }

    .leaderboard-entry.current {
      border-left-color: #ffff00;
      background: rgba(255, 255, 0, 0.1);
    }

    .leaderboard-rank {
      font-size: 20px;
      font-weight: bold;
      color: #00ff88;
      min-width: 40px;
    }

    .leaderboard-time {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
    }

    .leaderboard-date {
      font-size: 14px;
      color: #ccc;
    }

    /* Accessibility: clear keyboard focus indicator */
    button:focus-visible,
    .controls-header:focus-visible,
    input[type="range"]:focus-visible {
      outline: 3px solid #ffd700;
      outline-offset: 2px;
    }

    /* Accessibility: respect reduced-motion preference */
    @media (prefers-reduced-motion: reduce) {
      *,
      #colorBarFill,
      .controls-toggle,
      .controls-content,
      button,
      input[type="range"]::-webkit-slider-thumb,
      input[type="range"]::-moz-range-thumb {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    /* Shared clinical-arcade theme: polished controls without competing with play. */
    :root {
      --ui-surface: rgba(17, 27, 45, 0.9);
      --ui-surface-strong: rgba(23, 37, 60, 0.97);
      --ui-border: rgba(163, 191, 226, 0.24);
      --ui-text: #f4f7fb;
      --ui-muted: #acbad0;
      --ui-accent: #77aee8;
      --ui-focus: #ffd166;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body { min-height: 100dvh; background: #060a12; }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        linear-gradient(rgba(139, 174, 218, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139, 174, 218, 0.025) 1px, transparent 1px),
        radial-gradient(circle at 50% 0%, rgba(70, 112, 170, 0.15), transparent 45%);
      background-size: 48px 48px, 48px 48px, auto;
    }

    #gameCanvas {
      background: radial-gradient(circle at 50% 45%, #10192a 0%, #080d17 58%, #04070d 100%);
      box-shadow: none;
    }

    #message,
    #controls,
    .controls-header {
      background: var(--ui-surface);
      border-color: var(--ui-border);
    }

    #message {
      top: max(74px, calc(env(safe-area-inset-top) + 62px));
      left: 50%;
      right: auto;
      transform: translateX(-50%);
      z-index: 4;
      max-width: min(520px, calc(100vw - 48px));
      padding: 9px 18px;
      border-radius: 999px;
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      text-align: center;
      color: var(--ui-text);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.26);
    }

    #colorBar {
      top: max(14px, env(safe-area-inset-top));
      z-index: 4;
      width: min(420px, calc(100vw - 200px));
      height: 42px;
      border: 1px solid var(--ui-border);
      background: rgba(8, 13, 23, 0.82);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
    }

    #colorBarFill { border-radius: inherit; }

    #controls {
      top: max(16px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      z-index: 4;
      width: min(270px, calc(100vw - 32px));
      min-width: 0;
      overflow: hidden;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.34);
    }

    .controls-header {
      color: var(--ui-text);
      padding: 0.85rem 1rem;
    }

    .controls-content {
      max-height: min(72vh, 600px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--ui-accent) transparent;
    }

    .controls-content.collapsed {
      max-height: 0;
      padding: 0 16px;
      overflow: hidden;
    }

    .control-group { margin-bottom: 16px; }
    label { color: var(--ui-muted); }

    button {
      min-height: 44px;
      background: linear-gradient(145deg, #5a8dce, #3e64a5);
      border-color: rgba(190, 212, 240, 0.25);
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(26, 59, 108, 0.3);
    }

    button:hover {
      background: linear-gradient(145deg, #6da2df, #4d77b9);
      box-shadow: 0 10px 24px rgba(32, 72, 128, 0.38);
    }

    /* Utility buttons injected by development tooling should not inherit the
       full-width control-panel button rule. */
    body > button { width: auto; }

    #navButtons {
      inset-block-end: max(16px, env(safe-area-inset-bottom));
      inset-inline-start: max(16px, env(safe-area-inset-left));
      z-index: 4;
      padding: 6px;
      border: 1px solid var(--ui-border);
      border-radius: 16px;
      background: rgba(9, 15, 26, 0.76);
      backdrop-filter: blur(12px);
    }

    #navButtons button { padding: 10px 15px; }

    input[type="range"] {
      height: 5px;
      background: linear-gradient(to right, #6f9ed7, #8cc8e8);
      box-shadow: none;
    }

    .modal-content,
    .leaderboard-content {
      width: min(440px, calc(100vw - 32px));
      background: linear-gradient(155deg, #1b2a45, #10192b);
      border: 1px solid var(--ui-border);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55);
    }

    @media (max-width: 720px) {
      #colorBar {
        top: max(8px, env(safe-area-inset-top));
        width: calc(100vw - 152px);
        height: 40px;
      }

      #message {
        top: max(58px, calc(env(safe-area-inset-top) + 50px));
        max-width: calc(100vw - 20px);
      }

      #controls {
        top: auto;
        bottom: max(70px, calc(env(safe-area-inset-bottom) + 62px));
        left: max(8px, env(safe-area-inset-left));
        width: min(250px, calc(100vw - 16px));
      }

      #controls .controls-content:not(.collapsed) { max-height: 52dvh; }
      #navButtons { inset-inline-start: max(8px, env(safe-area-inset-left)); }

      .modal-content,
      .leaderboard-content { padding: 24px 18px; }
      .modal-title { font-size: 1.6rem; }
      .modal-time { font-size: 2.35rem; }
      .modal-button { margin: 5px 0; }
    }
  </style>
</head>
	<body>
	  <div id="navButtons">
	    <button id="backButton" type="button" onclick="goBack()"></button>
	    <button id="pauseButton" type="button" onclick="togglePause()" aria-pressed="false"></button>
	  </div>
	  <div id="colorBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="מד מהירות">
	    <div id="colorBarFill"></div>
	    <div id="colorBarLabel">מד מהירות</div>
	  </div>
  <div id="message" aria-live="polite">לחצו על הכדור</div>
  <div id="controls">
    <div class="controls-header collapsed" onclick="toggleControls()" tabindex="0" role="button" aria-expanded="false" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleControls()}">
      <span>הגדרות משחק</span>
      <span class="controls-toggle">▼</span>
    </div>
    <div class="controls-content collapsed" id="controls-content">
      <div class="control-group">
        <button onclick="initGame()">התחל מחדש</button>
      </div>
      <div class="control-group">
        <label for="redBrightness">בהירות (אדום):</label>
        <input type="range" id="redBrightness" min="0" max="200" value="100">
        <label for="redContrast">ניגודיות (אדום):</label>
        <input type="range" id="redContrast" min="0" max="200" value="100">
      </div>
      <div class="control-group">
        <label id="rightBrightnessLabel" for="rightBrightness">בהירות (ירוק):</label>
        <input type="range" id="rightBrightness" min="0" max="200" value="100">
        <label id="rightContrastLabel" for="rightContrast">ניגודיות (ירוק):</label>
        <input type="range" id="rightContrast" min="0" max="200" value="100">
      </div>
      <div class="control-group">
        <button id="toggleColor">החלף ירוק ↔ כחול</button>
      </div>
      <div class="control-group">
        <button id="showLeaderboard">לוח התוצאות</button>
      </div>
      <div class="control-group">
        <button id="languageToggle">🌐 English</button>
      </div>
    </div>
  </div>
  <canvas id="gameCanvas"></canvas>

  <!-- Completion Modal -->
  <div id="completionModal">
    <div class="modal-content">
      <div class="modal-title">🎉 מעולה! 🎉</div>
      <div class="modal-message">מילאת את מד המהירות!</div>
      <div class="modal-time" id="completionTime">0.00s</div>
      <div class="modal-message" id="completionRank">מקום חדש בלוח התוצאות!</div>
      <button class="modal-button" onclick="closeCompletionModal()">המשך</button>
      <button class="modal-button" onclick="showLeaderboard()">לוח התוצאות</button>
    </div>
  </div>

  <!-- Leaderboard Modal -->
  <div id="leaderboardModal">
    <div class="leaderboard-content">
      <div class="leaderboard-title">🏆 לוח התוצאות 🏆</div>
      <div id="leaderboardList"></div>
      <button class="modal-button" onclick="closeLeaderboard()" style="width: 100%; margin-top: 20px;">סגור</button>
    </div>
  </div>

  <script>
    let BALL_RADIUS = 60;
    const MAX_COLOR_BAR = 200; // Made longer to fill
    const COLOR_BAR_INCREASE = 8; // Smaller increase per click
    const COLOR_BAR_DECREASE_RATE = 0.3; // Slower decrease

    const canvas = document.getElementById('gameCanvas');
    const ctx    = canvas.getContext('2d');

    // Logical viewport dimensions used by all game logic. These differ from
    // canvas.width/height because the backing store is scaled by
    // devicePixelRatio for crisp mobile rendering.
    let viewW = window.innerWidth;
    let viewH = window.innerHeight;

    // Scale the ball to the smaller screen dimension so it fits on phones
    // instead of a fixed 60px radius that covers ~1/3 of a mobile screen.
    function computeSizes() {
      const minDim = Math.min(viewW, viewH);
      BALL_RADIUS = Math.round(Math.max(20, Math.min(60, minDim * 0.09)));
    }

    // Size the canvas to the visual viewport, accounting for devicePixelRatio.
    function resizeCanvas() {
      viewW = window.innerWidth;
      viewH = window.innerHeight;
      const dpr = window.devicePixelRatio || 1;
      canvas.style.width  = viewW + 'px';
      canvas.style.height = viewH + 'px';
      canvas.width  = Math.round(viewW * dpr);
      canvas.height = Math.round(viewH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      computeSizes();
    }
    const msg    = document.getElementById('message');
    const colorBarEl = document.getElementById('colorBar');
    const colorBarFill = document.getElementById('colorBarFill');
    const colorBarLabel = document.getElementById('colorBarLabel');
    
    let currentBall, clickCount = 0;
    let colorBarValue = 0;
    let colorBarInterval;
    let gameStartTime = 0;
    let gameTimer = 0;
    let timerInterval = null;
    let isGameActive = false;
    let isPaused = false;
    let pauseStartTime = 0;

    function runTimerInterval() {
      timerInterval = setInterval(() => {
        gameTimer = Math.floor((Date.now() - gameStartTime) / 1000);
      }, 1000);
    }

    function startTimer() {
      gameStartTime = Date.now();
      runTimerInterval();
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    const redBrightnessSlider = document.getElementById('redBrightness');
    const redContrastSlider = document.getElementById('redContrast');
    const rightBrightnessSlider = document.getElementById('rightBrightness');
    const rightContrastSlider = document.getElementById('rightContrast');
    const rightBrightnessLabel = document.getElementById('rightBrightnessLabel');
    const rightContrastLabel = document.getElementById('rightContrastLabel');

    let rightColor = 'green';
    let currentLanguage = 'he'; // 'he' for Hebrew, 'en' for English

    // Translation object
    const translations = {
      he: {
        title: 'משחק – לחצו על הכדורים הסטטיים',
        speedMeter: 'מד מהירות',
        clickBall: 'לחצו על הכדור',
	        gameSettings: 'הגדרות משחק',
	        back: 'חזרה',
	        restart: 'התחל מחדש',
	        brightnessRed: 'בהירות (אדום)',
	        contrastRed: 'ניגודיות (אדום)',
	        brightnessGreen: 'בהירות (ירוק)',
        contrastGreen: 'ניגודיות (ירוק)',

    function applyColorTransforms(color, brightness, contrast) {
      let r, g, b;
      if (color === 'red') {
        r = 255; g = 0; b = 0;
      } else if (color === 'blue') {
        r = 0; g = 0; b = 255;
    } else {
        r = 0; g = 128; b = 0;
      }

      // Apply brightness
      r = r * (brightness / 100);
      g = g * (brightness / 100);
      b = b * (brightness / 100);

      // Apply contrast
      const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
      r = factor * (r - 128) + 128;
      g = factor * (g - 128) + 128;
      b = factor * (b - 128) + 128;

      r = Math.max(0, Math.min(255, r));
      g = Math.max(0, Math.min(255, g));
      b = Math.max(0, Math.min(255, b));

      return `rgb(${r},${g},${b})`;
    }

    function createNewBall() {
      return {
        color: Math.random() < 0.5 ? 'red' : rightColor,
        x: Math.random() * (viewW - 2 * BALL_RADIUS) + BALL_RADIUS,
        y: Math.random() * (viewH - 2 * BALL_RADIUS) + BALL_RADIUS
      };
    }

    function updateColorBar() {
      if (!isGameActive) return;

      colorBarValue = Math.max(0, colorBarValue - COLOR_BAR_DECREASE_RATE);
      const percentage = (colorBarValue / MAX_COLOR_BAR) * 100;
      colorBarFill.style.width = percentage + '%';
      colorBarEl.setAttribute('aria-valuenow', String(Math.round(percentage)));

      // Update label with percentage
      colorBarLabel.textContent = `${translations[currentLanguage].speedMeter}: ${Math.round(percentage)}%`;
      
      // Update glow effect based on bar level
      if (percentage > 80) {
        colorBarFill.style.boxShadow = '0 0 30px rgba(0, 255, 0, 0.8)';
        colorBarLabel.style.color = '#00ff00';
      } else if (percentage > 50) {
        colorBarFill.style.boxShadow = '0 0 20px rgba(255, 255, 0, 0.6)';
        colorBarLabel.style.color = '#ffff00';
      } else if (percentage > 20) {
        colorBarFill.style.boxShadow = '0 0 15px rgba(255, 128, 0, 0.4)';
        colorBarLabel.style.color = '#ff8800';
      } else {
        colorBarFill.style.boxShadow = '0 0 10px rgba(255, 0, 0, 0.3)';
        colorBarLabel.style.color = '#ff0000';
      }
      
      // Add pulsing effect when bar is very high
      if (percentage > 90) {
        colorBarFill.style.animation = 'pulse 0.5s infinite alternate';
      } else {
        colorBarFill.style.animation = 'none';
      }
    }

    function increaseColorBar() {
      if (!isGameActive) return;
      
      colorBarValue = Math.min(MAX_COLOR_BAR, colorBarValue + COLOR_BAR_INCREASE);
      
      // Check for completion immediately after increase
      if (colorBarValue >= MAX_COLOR_BAR) {
        colorBarValue = MAX_COLOR_BAR; // Ensure it's exactly at max
        completeColorBar();
        return;
      }
      
      updateColorBar();
      
      // Add visual feedback when clicking
      colorBarFill.style.transform = 'scaleY(1.2)';
      setTimeout(() => {
        colorBarFill.style.transform = 'scaleY(1)';
      }, 100);
    }

    function completeColorBar() {
      isGameActive = false;
      stopTimer();
      const completionTime = (Date.now() - gameStartTime) / 1000;
      
      // Stop the interval
      if (colorBarInterval) {
        clearInterval(colorBarInterval);
      }
      if (window.UserCounter) {
        window.UserCounter.recordGameCompletion('Static Ball Game (Saccades)', {
          clicks: clickCount,
          time: completionTime,
          completed: true
        });
      }

      if (window.DTGProgress) {
        window.DTGProgress.record({
          game: 'static_ball',
          gameLabel: 'Static Ball Game (Saccades)',
          duration: completionTime,
          extra: { clicks: clickCount }
        });
      }

      // Set bar to 100% and celebration effects
      colorBarFill.style.width = '100%';
      colorBarEl.setAttribute('aria-valuenow', '100');
      colorBarFill.style.animation = 'pulse 0.3s infinite alternate';
      colorBarFill.style.boxShadow = '0 0 50px rgba(0, 255, 0, 1), 0 0 100px rgba(0, 255, 0, 0.5)';
      colorBarLabel.textContent = translations[currentLanguage].completed;
      colorBarLabel.style.color = '#00ff00';
      
      // Add screen flash effect
      document.body.style.background = 'linear-gradient(135deg, #00ff00 0%, #00cc00 100%)';
      setTimeout(() => {
        document.body.style.background = 'linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)';
      }, 200);
      
      // Save time and show modal with slight delay for effect
      saveCompletionTime(completionTime);
      setTimeout(() => {
        showCompletionModal(completionTime);
      }, 500);
    }

    function saveCompletionTime(time) {
      let times = JSON.parse(localStorage.getItem('colorBarTimes') || '[]');
      const locale = currentLanguage === 'he' ? 'he-IL' : 'en-US';
      const newEntry = {
        time: time,
        date: new Date().toLocaleDateString(locale),
        timestamp: Date.now()
      };
      times.push(newEntry);
      times.sort((a, b) => a.time - b.time); // Sort by time (fastest first)
      times = times.slice(0, 10); // Keep only top 10
      localStorage.setItem('colorBarTimes', JSON.stringify(times));
    }

    function showCompletionModal(time) {
      const modal = document.getElementById('completionModal');
      const timeElement = document.getElementById('completionTime');
      const rankElement = document.getElementById('completionRank');
      
      timeElement.textContent = time.toFixed(2) + 's';
      
      // Check rank
      const times = JSON.parse(localStorage.getItem('colorBarTimes') || '[]');
      const rank = times.findIndex(entry => entry.time === time) + 1;
      
      if (rank === 1) {
        rankElement.textContent = translations[currentLanguage].newRecord;
        rankElement.style.color = '#ffd700';
      } else if (rank <= 3) {
        rankElement.textContent = translations[currentLanguage].topRank.replace('{rank}', rank);
        rankElement.style.color = '#00ff88';
      } else if (rank <= 10) {
        rankElement.textContent = translations[currentLanguage].rank.replace('{rank}', rank);
        rankElement.style.color = '#fff';
      } else {
        rankElement.textContent = translations[currentLanguage].goodTime;
        rankElement.style.color = '#ccc';
      }
      
      modal.style.display = 'flex';
    }

    function closeCompletionModal() {
      document.getElementById('completionModal').style.display = 'none';
      initGame(); // Start new game
    }

    function initGame() {
      resizeCanvas();
      clickCount = 0;
      colorBarValue = 0;
      isPaused = false;
      updatePauseButton();
      updateColorBar();
      stopTimer();
      startTimer();
      isGameActive = true;

      msg.textContent = `${translations[currentLanguage].ballsClicked}: ${clickCount}`;
      
      // Reset color bar appearance
      colorBarFill.style.animation = 'none';
      colorBarLabel.textContent = `${translations[currentLanguage].speedMeter}: 0%`;
      colorBarLabel.style.color = '#fff';
      
      // Start color bar decrease timer
      if (colorBarInterval) {
        clearInterval(colorBarInterval);
      }
      colorBarInterval = setInterval(updateColorBar, 50); // Update every 50ms for smooth animation
      
      // Track game start in user counter
      if (window.UserCounter) {
        window.UserCounter.recordGameStart('Static Ball Game (Saccades)', 'Static Mode');
      }
      
      currentBall = createNewBall();
      updateColorBar();
      drawGame();
    }

    function drawGame() {
      ctx.clearRect(0, 0, viewW, viewH);
      
      if (currentBall) {
        ctx.beginPath();
        ctx.arc(currentBall.x, currentBall.y, BALL_RADIUS, 0, Math.PI * 2);
        
        if (currentBall.color === 'red') {
          ctx.fillStyle = applyColorTransforms('red', redBrightnessSlider.value, redContrastSlider.value);
        } else {
          ctx.fillStyle = applyColorTransforms(rightColor, rightBrightnessSlider.value, rightContrastSlider.value);
        }
        ctx.fill();
        ctx.stroke();
      }
    }

    function nextBall() {
      clickCount++;
      increaseColorBar(); // Increase color bar on each ball click
      currentBall = createNewBall();
      msg.textContent = `${translations[currentLanguage].ballsClicked}: ${clickCount}`;
      
      // Track milestone completions (every 10 clicks)
      if (window.UserCounter && clickCount % 10 === 0) {
        window.UserCounter.recordGameCompletion('Static Ball Game (Saccades)', {
          clicks: clickCount,
          milestone: `${clickCount} clicks`
        });
      }
      
      drawGame();
    }

    function toggleRightColor() {
      rightColor = rightColor === 'green' ? 'blue' : 'green';
      updateLanguageTexts();
      
      // Update current ball color if it's not red
      if (currentBall && currentBall.color !== 'red') {
        currentBall.color = rightColor;
      }
      drawGame();
    }

    function toggleControls() {
      const header = document.querySelector('.controls-header');
      const content = document.getElementById('controls-content');

      header.classList.toggle('collapsed');
      content.classList.toggle('collapsed');
      header.setAttribute('aria-expanded', String(!header.classList.contains('collapsed')));
    }

    function updatePauseButton() {
      const btn = document.getElementById('pauseButton');
      btn.textContent = isPaused
        ? '▶ ' + translations[currentLanguage].resume
        : '⏸ ' + translations[currentLanguage].pause;
      btn.setAttribute('aria-pressed', String(isPaused));
    }

    function togglePause() {
      // Nothing to pause once the round is complete (modal flow takes over).
      if (!isGameActive && !isPaused) { return; }

      isPaused = !isPaused;
      if (isPaused) {
        pauseStartTime = Date.now();
        stopTimer();
        if (colorBarInterval) {
          clearInterval(colorBarInterval);
          colorBarInterval = null;
        }
        isGameActive = false;
        msg.textContent = translations[currentLanguage].paused;
      } else {
        // Shift the start time forward so paused time never counts toward
        // the completion time / leaderboard.
        gameStartTime += Date.now() - pauseStartTime;
        runTimerInterval();
        colorBarInterval = setInterval(updateColorBar, 50);
        isGameActive = true;
        msg.textContent = `${translations[currentLanguage].ballsClicked}: ${clickCount}`;
      }
      updatePauseButton();
    }

    // Auto-pause when the tab/app goes to the background so the speed meter
    // doesn't drain and the clock doesn't run while the player isn't looking.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && isGameActive && !isPaused) {
        togglePause();
      }
    });

    function handlePointerDown(e) {
      if (isPaused || !isGameActive) { return; }
      e.preventDefault(); // Prevent default touch behavior
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX || e.touches[0].clientX) - rect.left;
      const my = (e.clientY || e.touches[0].clientY) - rect.top;

      if (currentBall) {
        const dx = mx - currentBall.x;
        const dy = my - currentBall.y;
        if (dx * dx + dy * dy <= BALL_RADIUS * BALL_RADIUS) {
          // Ball clicked - auto-collapse settings when user starts playing
          autoCollapseSettings();
          nextBall();
        }
      }
    }

    function autoCollapseSettings() {
      const header = document.querySelector('.controls-header');
      const content = document.getElementById('controls-content');
      
      if (!header.classList.contains('collapsed')) {
        header.classList.add('collapsed');
        content.classList.add('collapsed');
        header.setAttribute('aria-expanded', 'false');
      }
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('touchstart', handlePointerDown, { passive: false }); // Added touch support

    
    function showLeaderboard() {
      const modal = document.getElementById('leaderboardModal');
      const listElement = document.getElementById('leaderboardList');
      const times = JSON.parse(localStorage.getItem('colorBarTimes') || '[]');
      
      if (times.length === 0) {
        listElement.innerHTML = `<div style="text-align: center; color: #ccc; padding: 20px;">${translations[currentLanguage].noResults}</div>`;
      } else {
        listElement.innerHTML = times.map((entry, index) => {
          const medals = ['🥇', '🥈', '🥉'];
          const medal = index < 3 ? medals[index] : `${index + 1}.`;
          return `
            <div class="leaderboard-entry">
              <div class="leaderboard-rank">${medal}</div>
              <div>
                <div class="leaderboard-time">${entry.time.toFixed(2)}s</div>
                <div class="leaderboard-date">${entry.date}</div>
              </div>
            </div>
          `;
        }).join('');
      }
      
      modal.style.display = 'flex';
    }

    function closeLeaderboard() {
      document.getElementById('leaderboardModal').style.display = 'none';
    }

    ['input', 'change'].forEach(eventName => {
        redBrightnessSlider.addEventListener(eventName, drawGame);
        redContrastSlider.addEventListener(eventName, drawGame);
        rightBrightnessSlider.addEventListener(eventName, drawGame);
        rightContrastSlider.addEventListener(eventName, drawGame);
    });

	    function updateLanguageTexts() {
      // Update document title and lang attribute
      document.title = translations[currentLanguage].title;
      document.documentElement.lang = currentLanguage;
      
      // Update UI elements
      document.querySelector('.controls-header span').textContent = translations[currentLanguage].gameSettings;
      document.querySelector('button[onclick="initGame()"]').textContent = translations[currentLanguage].restart;
      document.querySelector('label[for="redBrightness"]').textContent = translations[currentLanguage].brightnessRed + ':';
      document.querySelector('label[for="redContrast"]').textContent = translations[currentLanguage].contrastRed + ':';
      
      // Update right color labels based on current color
      const colorName = rightColor === 'green' ? translations[currentLanguage].green : translations[currentLanguage].blue;
      rightBrightnessLabel.textContent = `${translations[currentLanguage][rightColor === 'green' ? 'brightnessGreen' : 'brightnessBlue']}:`;
      rightContrastLabel.textContent = `${translations[currentLanguage][rightColor === 'green' ? 'contrastGreen' : 'contrastBlue']}:`;
      
      // Update toggle color button
      document.getElementById('toggleColor').textContent = rightColor === 'green' 
        ? translations[currentLanguage].toggleColor 
        : translations[currentLanguage].toggleColorBlue;
      
	      // Update other buttons
	      document.getElementById('showLeaderboard').textContent = translations[currentLanguage].leaderboard;
	      document.getElementById('languageToggle').textContent = translations[currentLanguage].languageButton;
	      document.getElementById('backButton').textContent = translations[currentLanguage].back;
      updatePauseButton();

      // Update message
      msg.textContent = isPaused
        ? translations[currentLanguage].paused
        : `${translations[currentLanguage].ballsClicked}: ${clickCount}`;

      // Update color bar label
      const percentage = (colorBarValue / MAX_COLOR_BAR) * 100;
      colorBarLabel.textContent = `${translations[currentLanguage].speedMeter}: ${Math.round(percentage)}%`;
      colorBarEl.setAttribute('aria-label', translations[currentLanguage].speedMeter);
      
      // Update modal content
      document.querySelector('.modal-title').textContent = translations[currentLanguage].excellent;
      document.querySelector('.modal-message').textContent = translations[currentLanguage].filledSpeedMeter;
      document.querySelector('button[onclick="closeCompletionModal()"]').textContent = translations[currentLanguage].continue;
      document.querySelector('button[onclick="showLeaderboard()"]').textContent = translations[currentLanguage].leaderboard;
      
      // Update leaderboard modal
      document.querySelector('.leaderboard-title').textContent = translations[currentLanguage].leaderboardTitle;
      document.querySelector('button[onclick="closeLeaderboard()"]').textContent = translations[currentLanguage].close;
      
      // Update text direction for RTL/LTR
      document.body.style.direction = currentLanguage === 'he' ? 'rtl' : 'ltr';
      
      // Update message position for RTL/LTR
      if (currentLanguage === 'he') {
        msg.style.right = '20px';
        msg.style.left = 'auto';
      } else {
        msg.style.left = '20px';
        msg.style.right = 'auto';
      }
    }

	    function toggleLanguage() {
	      currentLanguage = currentLanguage === 'he' ? 'en' : 'he';
	      localStorage.setItem('gameLanguage', currentLanguage);
	      updateLanguageTexts();
	    }

	    function goBack() {
	      try {
	        const hasReferrer = Boolean(document.referrer);
	        const sameOrigin = hasReferrer
	          && new URL(document.referrer).origin === window.location.origin;
	        if (sameOrigin) {
	          window.history.back();
	          return;
	        }
	      } catch (_) {
	        // Fall back to index navigation.
	      }
	      window.location.href = 'index.html';
	    }

    // Load saved language preference
    function loadLanguagePreference() {
      const savedLanguage = localStorage.getItem('gameLanguage');
      if (savedLanguage && (savedLanguage === 'he' || savedLanguage === 'en')) {
        currentLanguage = savedLanguage;
      }
      updateLanguageTexts();
    }

    document.getElementById('toggleColor').addEventListener('click', toggleRightColor);
    document.getElementById('showLeaderboard').addEventListener('click', showLeaderboard);
    document.getElementById('languageToggle').addEventListener('click', toggleLanguage);

    // Non-destructive resize: re-size the canvas, recompute ball size, and
    // clamp the current ball back into view WITHOUT resetting the game/timer.
    // (Previously `resize` -> initGame reset the game whenever the mobile
    // address bar slid in/out.)
    let resizeTimer;
    function handleResize() {
      resizeCanvas();
      if (currentBall) {
        currentBall.x = Math.min(Math.max(currentBall.x, BALL_RADIUS), viewW - BALL_RADIUS);
        currentBall.y = Math.min(Math.max(currentBall.y, BALL_RADIUS), viewH - BALL_RADIUS);
      }
      drawGame();
    }
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(handleResize, 150);
    });
    window.addEventListener('orientationchange', () => setTimeout(handleResize, 200));

    // Initialize language and game
    loadLanguagePreference();
    initGame();
  </script>
