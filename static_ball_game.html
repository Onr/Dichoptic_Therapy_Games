<!DOCTYPE html>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: #fff;
    }
    #gameCanvas {
      display: block;
      background: #000000;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
    }
    #message {
      position: absolute;
      top: 80px;
      right: 20px;
      font: 700 24px 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, rgba(42, 82, 152, 0.95), rgba(30, 60, 114, 0.95));
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    #colorBar {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 40px;
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }

    #colorBarFill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,
        #4a6cf7 0%,
        #6366f1 20%,
        #7c5bf0 40%,
        #8b5cf6 60%,
        #a78bfa 80%,
        #c4b5fd 100%);
      border-radius: 18px;
      transition: width 0.1s ease-out;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
      transition: transform 0.1s ease-out;
    }

    @keyframes pulse {
      from { box-shadow: 0 0 30px rgba(139, 92, 246, 0.8); }
      to { box-shadow: 0 0 50px rgba(139, 92, 246, 1), 0 0 80px rgba(139, 92, 246, 0.5); }
    }

    #colorBarLabel {
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      font: 600 14px 'Segoe UI', sans-serif;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
    }
    #controls {
      position: absolute;
      top: 20px;
      left: 20px;
      background: linear-gradient(135deg, rgba(42, 82, 152, 0.95), rgba(30, 60, 114, 0.95));
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      min-width: 200px;
    }

    .controls-header {
      padding: 1rem 1.5rem;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(42, 82, 152, 0.95), rgba(30, 60, 114, 0.95));
      border-radius: 16px 16px 0 0;
      transition: all 0.3s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #e0e6ff;
      font-weight: 600;
      user-select: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .controls-header:hover {
      background: linear-gradient(135deg, rgba(52, 92, 162, 0.95), rgba(40, 70, 124, 0.95));
    }

    .controls-header.collapsed {
      border-radius: 16px;
      border-bottom: none;
    }

    .controls-toggle {
      font-size: 1.2rem;
      transition: transform 0.3s ease;
      color: #e0e6ff;
    }

    .controls-header.collapsed .controls-toggle {
      transform: rotate(-90deg);
    }

    .controls-content {
      overflow: hidden;

      max-height: 1000px;
      padding: 20px;
    }

    .controls-content.collapsed {
      max-height: 0;
      padding: 0 20px;
    }
    .control-group {
      margin-bottom: 20px;
    }
    .control-group:last-child {
      margin-bottom: 0;
    }
    label {

      color: #e0e6ff;

    .modal-content {

</head>

  <script>
    const BALL_RADIUS = 60;
    const MAX_COLOR_BAR = 200; // Made longer to fill
    const COLOR_BAR_INCREASE = 8; // Smaller increase per click
    const COLOR_BAR_DECREASE_RATE = 0.3; // Slower decrease

    const canvas = document.getElementById('gameCanvas');
    const ctx    = canvas.getContext('2d');
    const msg    = document.getElementById('message');
    const colorBarFill = document.getElementById('colorBarFill');
    const colorBarLabel = document.getElementById('colorBarLabel');

    let currentBall, clickCount = 0;
    let colorBarValue = 0;
    let colorBarInterval;
    let gameStartTime = 0;
    let isGameActive = false;
    let isPaused = false;
    let pauseStartTime = 0;
    let totalPausedTime = 0;

    const redBrightnessSlider = document.getElementById('redBrightness');
    const redContrastSlider = document.getElementById('redContrast');
    const rightBrightnessSlider = document.getElementById('rightBrightness');
    const rightContrastSlider = document.getElementById('rightContrast');
    const rightBrightnessLabel = document.getElementById('rightBrightnessLabel');
    const rightContrastLabel = document.getElementById('rightContrastLabel');

    let rightColor = 'green';
    let currentLanguage = 'he'; // 'he' for Hebrew, 'en' for English

    // Translation object
    const translations = {
      he: {
        title: 'משחק – לחצו על הכדורים הסטטיים',
        speedMeter: 'מד מהירות',
        clickBall: 'לחצו על הכדור',

	        brightnessGreen: 'בהירות (ירוק)',

        brightnessBlue: 'בהירות (כחול)',
        contrastBlue: 'ניגודיות (כחול)',
        pause: 'השהה',
        resume: 'המשך',
        paused: '⏸ מושהה',
        toggleColor: 'החלף ירוק ↔ כחול',
        toggleColorBlue: 'החלף כחול ↔ ירוק',
        leaderboard: 'לוח התוצאות',
        languageButton: '🌐 English',
        ballsClicked: 'כדורים שנלחצו',
        completed: '🎉 הושלם! 🎉',
        excellent: '🎉 מעולה! 🎉',
        filledSpeedMeter: 'מילאת את מד המהירות!',
        newRecord: '🥇 שיא חדש! מקום ראשון!',
        topRank: '🏆 מקום {rank} בלוח התוצאות!',
        rank: 'מקום {rank} בלוח התוצאות',
        goodTime: 'זמן טוב! נסה שוב לשיפור',
        continue: 'המשך',
        leaderboardTitle: '🏆 לוח התוצאות 🏆',
        close: 'סגור',
        noResults: 'אין תוצאות עדיין<br>השלם את מד המהירות כדי להתחיל!',
        green: 'ירוק',
        blue: 'כחול'
      },
      en: {
        title: 'Game – Click the Static Balls',
        speedMeter: 'Speed Meter',
	        clickBall: 'Click the Ball',
	        gameSettings: 'Game Settings',
	        back: 'Back',
	        restart: 'Restart',
	        brightnessRed: 'Brightness (Red)',
	        contrastRed: 'Contrast (Red)',
	        brightnessGreen: 'Brightness (Green)',
        contrastGreen: 'Contrast (Green)',
        brightnessBlue: 'Brightness (Blue)',
        contrastBlue: 'Contrast (Blue)',
        pause: 'Pause',
        resume: 'Resume',
        paused: '⏸ Paused',
        toggleColor: 'Switch Green ↔ Blue',
        toggleColorBlue: 'Switch Blue ↔ Green',
        leaderboard: 'Leaderboard',
        languageButton: '🌐 עברית',
        ballsClicked: 'Balls Clicked',
        completed: '🎉 Completed! 🎉',
        excellent: '🎉 Excellent! 🎉',
        filledSpeedMeter: 'You filled the speed meter!',
        newRecord: '🥇 New Record! First Place!',
        topRank: '🏆 Rank {rank} on leaderboard!',
        rank: 'Rank {rank} on leaderboard',
        goodTime: 'Good time! Try again to improve',
        continue: 'Continue',
        leaderboardTitle: '🏆 Leaderboard 🏆',

        noResults: 'No results yet<br>Complete the speed meter to start!',
        green: 'Green',
        blue: 'Blue'
      }
    };

    function applyColorTransforms(color, brightness, contrast) {
      let r, g, b;
      if (color === 'red') {
        r = 255; g = 0; b = 0;
      } else if (color === 'blue') {
        r = 0; g = 0; b = 255;
    } else {
        r = 0; g = 128; b = 0;
      }

      // Apply brightness
      r = r * (brightness / 100);
      g = g * (brightness / 100);
      b = b * (brightness / 100);

      // Apply contrast
      const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
      r = factor * (r - 128) + 128;
      g = factor * (g - 128) + 128;
      b = factor * (b - 128) + 128;

      r = Math.max(0, Math.min(255, r));
      g = Math.max(0, Math.min(255, g));
      b = Math.max(0, Math.min(255, b));

      return `rgb(${r},${g},${b})`;
    }

    function createNewBall() {
      return {
        color: Math.random() < 0.5 ? 'red' : rightColor,
        ...createSafeTargetPosition()
      };
    }

    function createSafeTargetPosition() {
      const exclusions = ['controls', 'message', 'colorBar', 'navButtons']
        .map(id => document.getElementById(id))
        .filter(Boolean)
        .map(element => element.getBoundingClientRect());
      const margin = BALL_RADIUS + 16;
      for (let attempt = 0; attempt < 80; attempt++) {
        const x = margin + Math.random() * Math.max(1, canvas.width - (margin * 2));
        const y = margin + Math.random() * Math.max(1, canvas.height - (margin * 2));
        const overlapsUi = exclusions.some(rect =>
          x + BALL_RADIUS + 16 > rect.left && x - BALL_RADIUS - 16 < rect.right &&
          y + BALL_RADIUS + 16 > rect.top && y - BALL_RADIUS - 16 < rect.bottom
        );
        if (!overlapsUi) return { x, y };
      }
      // Safe fallback for unusually small viewports.
      return { x: canvas.width / 2, y: Math.max(BALL_RADIUS + 16, canvas.height / 2) };
    }

    function drawSpaceship(x, y, radius, color) {
      // Keep the dichoptic stimulus one flat, solid colour.
      ctx.save();
      ctx.translate(x, y);
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(-radius * 0.42, -radius * 0.56);
      ctx.lineTo(-radius * 0.26, -radius * 0.18);
      ctx.lineTo(-radius * 0.72, -radius * 0.34);
      ctx.lineTo(-radius * 0.58, 0);
      ctx.lineTo(-radius * 0.72, radius * 0.34);
      ctx.lineTo(-radius * 0.26, radius * 0.18);
      ctx.lineTo(-radius * 0.42, radius * 0.56);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }

    function updateColorBar() {
      if (!isGameActive) return;

      colorBarValue = Math.max(0, colorBarValue - COLOR_BAR_DECREASE_RATE);
      const percentage = (colorBarValue / MAX_COLOR_BAR) * 100;
      colorBarFill.style.width = percentage + '%';

      // Update label with percentage
      colorBarLabel.textContent = `${translations[currentLanguage].speedMeter}: ${Math.round(percentage)}%`;

      // Update glow effect based on bar level
      if (percentage > 80) {
        colorBarFill.style.boxShadow = '0 0 30px rgba(139, 92, 246, 0.8)';
        colorBarLabel.style.color = '#a78bfa';
      } else if (percentage > 50) {
        colorBarFill.style.boxShadow = '0 0 20px rgba(99, 102, 241, 0.6)';
        colorBarLabel.style.color = '#818cf8';
      } else if (percentage > 20) {
        colorBarFill.style.boxShadow = '0 0 15px rgba(79, 70, 229, 0.4)';
        colorBarLabel.style.color = '#6366f1';
      } else {
        colorBarFill.style.boxShadow = '0 0 10px rgba(67, 56, 202, 0.3)';
        colorBarLabel.style.color = '#4f46e5';
      }

      // Add pulsing effect when bar is very high
      if (percentage > 90) {
        colorBarFill.style.animation = 'pulse 0.5s infinite alternate';
      } else {
        colorBarFill.style.animation = 'none';
      }
    }

    function increaseColorBar() {
      if (!isGameActive) return;

      colorBarValue = Math.min(MAX_COLOR_BAR, colorBarValue + COLOR_BAR_INCREASE);

      // Check for completion immediately after increase
      if (colorBarValue >= MAX_COLOR_BAR) {
        colorBarValue = MAX_COLOR_BAR; // Ensure it's exactly at max
        completeColorBar();
        return;
      }

      updateColorBar();

      // Add visual feedback when clicking
      colorBarFill.style.transform = 'scaleY(1.2)';
      setTimeout(() => {
        colorBarFill.style.transform = 'scaleY(1)';
      }, 100);
    }

    function completeColorBar() {
      isGameActive = false;
      const completionTime = (Date.now() - gameStartTime - totalPausedTime) / 1000;

      // Stop the interval
      if (colorBarInterval) {
        clearInterval(colorBarInterval);
      }

      // Set bar to 100% and celebration effects
      colorBarFill.style.width = '100%';
      colorBarFill.style.animation = 'pulse 0.3s infinite alternate';
      colorBarFill.style.boxShadow = '0 0 50px rgba(139, 92, 246, 1), 0 0 100px rgba(139, 92, 246, 0.5)';
      colorBarLabel.textContent = translations[currentLanguage].completed;
      colorBarLabel.style.color = '#c4b5fd';

      // Save time and show modal with slight delay for effect
      saveCompletionTime(completionTime);
      setTimeout(() => {
        showCompletionModal(completionTime);
      }, 500);
    }

    function saveCompletionTime(time) {
      let times = JSON.parse(localStorage.getItem('colorBarTimes') || '[]');
      const locale = currentLanguage === 'he' ? 'he-IL' : 'en-US';
      const newEntry = {
        time: time,
        date: new Date().toLocaleDateString(locale),
        timestamp: Date.now()
      };
      times.push(newEntry);
      times.sort((a, b) => a.time - b.time); // Sort by time (fastest first)
      times = times.slice(0, 10); // Keep only top 10
      localStorage.setItem('colorBarTimes', JSON.stringify(times));
    }

    function showCompletionModal(time) {
      const modal = document.getElementById('completionModal');
      const timeElement = document.getElementById('completionTime');
      const rankElement = document.getElementById('completionRank');

      timeElement.textContent = time.toFixed(2) + 's';

      // Check rank
      const times = JSON.parse(localStorage.getItem('colorBarTimes') || '[]');
      const rank = times.findIndex(entry => entry.time === time) + 1;

      if (rank === 1) {
        rankElement.textContent = translations[currentLanguage].newRecord;
        rankElement.style.color = '#ffd700';
      } else if (rank <= 3) {
        rankElement.textContent = translations[currentLanguage].topRank.replace('{rank}', rank);
        rankElement.style.color = '#00ff88';
      } else if (rank <= 10) {
        rankElement.textContent = translations[currentLanguage].rank.replace('{rank}', rank);
        rankElement.style.color = '#fff';
      } else {
        rankElement.textContent = translations[currentLanguage].goodTime;
        rankElement.style.color = '#ccc';
      }

      modal.style.display = 'flex';
      // Focus the first button in the modal
      const firstBtn = modal.querySelector('.modal-button');
      if (firstBtn) firstBtn.focus();
    }

    function closeCompletionModal() {
      document.getElementById('completionModal').style.display = 'none';
      initGame(); // Start new game
    }

    function initGame() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      clickCount = 0;
      colorBarValue = 0;
      gameStartTime = Date.now();
      isGameActive = true;
      isPaused = false;
      totalPausedTime = 0;

      // Reset pause UI
      document.getElementById('pauseOverlay').style.display = 'none';
      const pauseButton = document.getElementById('pauseButton');
      pauseButton.textContent = '⏸';
      pauseButton.setAttribute('aria-label', translations[currentLanguage].pause);
      pauseButton.title = translations[currentLanguage].pause;

      msg.textContent = `${translations[currentLanguage].ballsClicked}: ${clickCount}`;

      // Reset color bar appearance
      colorBarFill.style.animation = 'none';
      colorBarLabel.textContent = `${translations[currentLanguage].speedMeter}: 0%`;
      colorBarLabel.style.color = '#fff';

      // Start color bar decrease timer
      if (colorBarInterval) {
        clearInterval(colorBarInterval);
      }
      colorBarInterval = setInterval(updateColorBar, 50); // Update every 50ms for smooth animation

      // Track game start in user counter
      if (window.UserCounter) {
        window.UserCounter.recordGameStart('Static Ball Game (Saccades)', 'Static Mode');
      }

      currentBall = createNewBall();
      updateColorBar();
      drawGame();
    }

    function drawGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (currentBall) {
      let targetColor;
      if (currentBall.color === 'red') {
          targetColor = applyColorTransforms('red', redBrightnessSlider.value, redContrastSlider.value);
      } else {
          targetColor = applyColorTransforms(rightColor, rightBrightnessSlider.value, rightContrastSlider.value);
      }
      drawSpaceship(currentBall.x, currentBall.y, BALL_RADIUS, targetColor);
      }
    }

    function nextBall() {
      clickCount++;
      increaseColorBar(); // Increase color bar on each ball click
      if (!isGameActive) return;
      currentBall = createNewBall();
      msg.textContent = `${translations[currentLanguage].ballsClicked}: ${clickCount}`;

      // Track milestone completions (every 10 clicks)
      if (window.UserCounter && clickCount % 10 === 0) {
        window.UserCounter.recordGameCompletion('Static Ball Game (Saccades)', {
          clicks: clickCount,
          milestone: `${clickCount} clicks`
        });
      }

      drawGame();
    }

    function toggleRightColor() {
      rightColor = rightColor === 'green' ? 'blue' : 'green';
      updateLanguageTexts();

      // Update current ball color if it's not red
      if (currentBall && currentBall.color !== 'red') {
        currentBall.color = rightColor;
      }
      drawGame();
    }

    function toggleControls() {
      const header = document.querySelector('.controls-header');
      const content = document.getElementById('controls-content');

      header.classList.toggle('collapsed');
      content.classList.toggle('collapsed');
      const isExpanded = !header.classList.contains('collapsed');
      header.setAttribute('aria-expanded', String(isExpanded));
    }

    function togglePause() {
      if (!isGameActive) return;

      isPaused = !isPaused;
      const overlay = document.getElementById('pauseOverlay');
      const btn = document.getElementById('pauseButton');

      if (isPaused) {
        // Pause
        pauseStartTime = Date.now();
        if (colorBarInterval) {
          clearInterval(colorBarInterval);
          colorBarInterval = null;
        }
        overlay.style.display = 'flex';
        document.getElementById('pauseOverlayText').textContent = translations[currentLanguage].paused;
        btn.textContent = '▶';
        btn.setAttribute('aria-label', translations[currentLanguage].resume);
        btn.title = translations[currentLanguage].resume;
      } else {
        // Resume
        totalPausedTime += Date.now() - pauseStartTime;
        colorBarInterval = setInterval(updateColorBar, 50);
        overlay.style.display = 'none';
        btn.textContent = '⏸';
        btn.setAttribute('aria-label', translations[currentLanguage].pause);
        btn.title = translations[currentLanguage].pause;
      }
    }

    function handlePointerDown(e) {
      if (isPaused) return; // Ignore clicks while paused
      e.preventDefault(); // Prevent default touch behavior
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX || e.touches[0].clientX) - rect.left;
      const my = (e.clientY || e.touches[0].clientY) - rect.top;

      if (currentBall) {
        const dx = mx - currentBall.x;
        const dy = my - currentBall.y;
        if (dx * dx + dy * dy <= BALL_RADIUS * BALL_RADIUS) {
          // Ball clicked - auto-collapse settings when user starts playing
          autoCollapseSettings();
          nextBall();
        }
      }
    }

    function autoCollapseSettings() {
      const header = document.querySelector('.controls-header');
      const content = document.getElementById('controls-content');

      if (!header.classList.contains('collapsed')) {
        header.classList.add('collapsed');
        content.classList.add('collapsed');
        header.setAttribute('aria-expanded', 'false');
      }
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('touchstart', handlePointerDown, { passive: false }); // Added touch support


    function showLeaderboard() {
      const modal = document.getElementById('leaderboardModal');
      const listElement = document.getElementById('leaderboardList');
      const times = JSON.parse(localStorage.getItem('colorBarTimes') || '[]');

      if (times.length === 0) {
        listElement.innerHTML = `<div style="text-align: center; color: #ccc; padding: 20px;">${translations[currentLanguage].noResults}</div>`;
      } else {
        listElement.innerHTML = times.map((entry, index) => {
          const medals = ['🥇', '🥈', '🥉'];
          const medal = index < 3 ? medals[index] : `${index + 1}.`;
          return `
            <div class="leaderboard-entry">
              <div class="leaderboard-rank">${medal}</div>
              <div>
                <div class="leaderboard-time">${entry.time.toFixed(2)}s</div>
                <div class="leaderboard-date">${entry.date}</div>
              </div>
            </div>
          `;
        }).join('');
      }

      modal.style.display = 'flex';
      // Focus the close button in the leaderboard modal
      const closeBtn = modal.querySelector('.modal-button');
      if (closeBtn) closeBtn.focus();
    }

    function closeLeaderboard() {
      document.getElementById('leaderboardModal').style.display = 'none';
    }

    ['input', 'change'].forEach(eventName => {
        redBrightnessSlider.addEventListener(eventName, drawGame);
        redContrastSlider.addEventListener(eventName, drawGame);
        rightBrightnessSlider.addEventListener(eventName, drawGame);
        rightContrastSlider.addEventListener(eventName, drawGame);
    });

	    function updateLanguageTexts() {
      // Update document title and lang attribute
      document.title = translations[currentLanguage].title;
      document.documentElement.lang = currentLanguage;

      // Update UI elements
      document.querySelector('.controls-header span').textContent = translations[currentLanguage].gameSettings;
      document.querySelector('button[onclick="initGame()"]').textContent = translations[currentLanguage].restart;
      document.querySelector('label[for="redBrightness"]').textContent = translations[currentLanguage].brightnessRed + ':';
      document.querySelector('label[for="redContrast"]').textContent = translations[currentLanguage].contrastRed + ':';

      // Update right color labels based on current color
      const colorName = rightColor === 'green' ? translations[currentLanguage].green : translations[currentLanguage].blue;
      rightBrightnessLabel.textContent = `${translations[currentLanguage][rightColor === 'green' ? 'brightnessGreen' : 'brightnessBlue']}:`;
      rightContrastLabel.textContent = `${translations[currentLanguage][rightColor === 'green' ? 'contrastGreen' : 'contrastBlue']}:`;

      // Update toggle color button
      document.getElementById('toggleColor').textContent = rightColor === 'green'
        ? translations[currentLanguage].toggleColor
        : translations[currentLanguage].toggleColorBlue;

	      // Update other buttons
	      document.getElementById('showLeaderboard').textContent = translations[currentLanguage].leaderboard;
      document.getElementById('languageToggle').textContent = translations[currentLanguage].languageButton;
      const pauseButton = document.getElementById('pauseButton');
      const pauseLabel = isPaused ? translations[currentLanguage].resume : translations[currentLanguage].pause;
      pauseButton.setAttribute('aria-label', pauseLabel);
      pauseButton.title = pauseLabel;
	      document.getElementById('backButton').textContent = translations[currentLanguage].back;

      // Update message
      msg.textContent = `${translations[currentLanguage].ballsClicked}: ${clickCount}`;

      // Update color bar label
      const percentage = (colorBarValue / MAX_COLOR_BAR) * 100;
      colorBarLabel.textContent = `${translations[currentLanguage].speedMeter}: ${Math.round(percentage)}%`;

      // Update modal content
      document.querySelector('.modal-title').textContent = translations[currentLanguage].excellent;
      document.querySelector('.modal-message').textContent = translations[currentLanguage].filledSpeedMeter;
      document.querySelector('button[onclick="closeCompletionModal()"]').textContent = translations[currentLanguage].continue;
      document.querySelector('button[onclick="showLeaderboard()"]').textContent = translations[currentLanguage].leaderboard;

      // Update leaderboard modal
      document.querySelector('.leaderboard-title').textContent = translations[currentLanguage].leaderboardTitle;
      document.querySelector('button[onclick="closeLeaderboard()"]').textContent = translations[currentLanguage].close;

      // Update text direction for RTL/LTR
      document.body.style.direction = currentLanguage === 'he' ? 'rtl' : 'ltr';

      // Update message position for RTL/LTR
      if (currentLanguage === 'he') {
        msg.style.right = '20px';
        msg.style.left = 'auto';
      } else {
        msg.style.left = '20px';
        msg.style.right = 'auto';
      }
    }

	    function toggleLanguage() {
	      currentLanguage = currentLanguage === 'he' ? 'en' : 'he';
	      localStorage.setItem('language', currentLanguage);
	      updateLanguageTexts();
	    }

	    function goBack() {
	      try {
	        const hasReferrer = Boolean(document.referrer);
	        const sameOrigin = hasReferrer
	          && new URL(document.referrer).origin === window.location.origin;
	        if (sameOrigin) {
	          window.history.back();
	          return;
	        }
	      } catch (_) {
	        // Fall back to index navigation.
	      }
	      window.location.href = 'index.html';
	    }

    // Load saved language preference
    function loadLanguagePreference() {
      const savedLanguage = localStorage.getItem('language');
      if (savedLanguage && (savedLanguage === 'he' || savedLanguage === 'en')) {
        currentLanguage = savedLanguage;
      }
      updateLanguageTexts();
    }

    document.getElementById('toggleColor').addEventListener('click', toggleRightColor);
    document.getElementById('showLeaderboard').addEventListener('click', showLeaderboard);
    document.getElementById('languageToggle').addEventListener('click', toggleLanguage);

    window.addEventListener('resize', initGame);

    // Modal focus trap and Escape key handling
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        const completionModal = document.getElementById('completionModal');
        const leaderboardModal = document.getElementById('leaderboardModal');
        if (completionModal.style.display === 'flex') {
          closeCompletionModal();
        } else if (leaderboardModal.style.display === 'flex') {
          closeLeaderboard();
        }
      }

      // Focus trap for open modals
      if (e.key === 'Tab') {
        const completionModal = document.getElementById('completionModal');
        const leaderboardModal = document.getElementById('leaderboardModal');
        let activeModal = null;
        if (completionModal.style.display === 'flex') activeModal = completionModal;
        else if (leaderboardModal.style.display === 'flex') activeModal = leaderboardModal;

        if (activeModal) {
          const focusable = activeModal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
          if (focusable.length === 0) return;
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (e.shiftKey) {
            if (document.activeElement === first) {
              e.preventDefault();
              last.focus();
            }
          } else {
            if (document.activeElement === last) {
              e.preventDefault();
              first.focus();
            }
          }
        }
      }
    });

    // Initialize language and game
    loadLanguagePreference();
    initGame();
  </script>

  <!-- User Tracking -->
  <script src="src/utils/userCounter.js"></script>
</body>
</html>
