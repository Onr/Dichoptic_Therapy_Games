<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub - Choose Your Challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #fff;
    }
    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 3rem 4rem;
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    h1 {
      font-weight: 600;
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    p {
        margin-bottom: 2rem;
        opacity: 0.9;
    }
    .game-selection {
        display: flex;
        gap: 1.5rem;
        justify-content: center;
    }
    .game-card {
      background: rgba(255, 255, 255, 0.25);
      padding: 1.5rem;
      border-radius: 15px;
      text-decoration: none;
      color: white;
      transition: background 0.3s, transform 0.3s;
      width: 200px;
    }
    .game-card:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateY(-5px);
    }
    .game-card h2 {
        font-size: 1.5rem;
        margin-top: 0;
        margin-bottom: 0.5rem;
    }
    .game-card p {
        font-size: 0.9rem;
        opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Game Hub</h1>
    <p>Choose your challenge and start playing!</p>
    <div class="game-selection">
      <a href="memory_game.html" class="game-card">
        <h2>Memory Game</h2>
        <p>Test your memory with this classic card matching game. Enhanced for binocular vision therapy.</p>
      </a>
      <a href="ball_game.html" class="game-card">
        <h2>Ball Game</h2>
        <p>Click the numbered balls in the correct order as they move around the screen. Adjust colors for dichoptic therapy.</p>
      </a>
    </div>
  </div>
</body>
</html>
