<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub - Choose Your Challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #fff;
    }
    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 3rem 4rem;
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    h1 {
      font-weight: 600;
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    p {
        margin-bottom: 2rem;
        opacity: 0.9;
    }
    .game-selection {
        display: flex;
        gap: 1.5rem;
        justify-content: center;
    }
    .game-card {
      background: rgba(255, 255, 255, 0.25);
      padding: 1.5rem;
      border-radius: 15px;
      text-decoration: none;
      color: white;
      transition: background 0.3s, transform 0.3s;
      width: 200px;
    }
    .game-card:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateY(-5px);
    }
    .game-card h2 {
        font-size: 1.5rem;
        margin-top: 0;
        margin-bottom: 0.5rem;
    }
    .game-card p {
        font-size: 0.9rem;
        opacity: 0.8;
    }
    #toggle-language {
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 2rem;
        font-family: 'Poppins', sans-serif;
        transition: background 0.3s;
    }
    #toggle-language:hover {
        background: rgba(255, 255, 255, 0.4);
    }
    [dir="rtl"] .game-card {
        text-align: right;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 data-i18n="title">Game Hub</h1>
    <p data-i18n="subtitle">Choose your challenge and start playing!</p>
    <div class="game-selection">
      <a href="memory_game.html" class="game-card">
        <h2 data-i18n="memoryGameTitle">Memory Game</h2>
        <p data-i18n="memoryGameDesc">Test your memory with this classic card matching game. Enhanced for binocular vision therapy.</p>
      </a>
      <a href="ball_game.html" class="game-card">
        <h2 data-i18n="ballGameTitle">Ball Game</h2>
        <p data-i18n="ballGameDesc">Click the numbered balls in the correct order as they move around the screen. Adjust colors for dichoptic therapy.</p>
      </a>
    </div>
    <button id="toggle-language" data-i18n="languageButton">עברית</button>
  </div>

  <script>
    const translations = {
      en: {
        title: 'Game Hub',
        subtitle: 'Choose your challenge and start playing!',
        memoryGameTitle: 'Memory Game',
        memoryGameDesc: 'Test your memory with this classic card matching game. Enhanced for binocular vision therapy.',
        ballGameTitle: 'Ball Game',
        ballGameDesc: 'Click the numbered balls in the correct order as they move around the screen. Adjust colors for dichoptic therapy.',
        languageButton: 'עברית'
      },
      he: {
        title: 'מרכז משחקים',
        subtitle: 'בחר את האתגר שלך והתחל לשחק!',
        memoryGameTitle: 'משחק זיכרון',
        memoryGameDesc: 'בחנו את הזיכרון שלכם עם משחק קלפים קלאסי זה. מותאם לטיפול בראייה דו-עינית.',
        ballGameTitle: 'משחק כדורים',
        ballGameDesc: 'לחצו על הכדורים הממוספרים בסדר הנכון בזמן שהם נעים על המסך. התאימו את הצבעים לטיפול דיכופטי.',
        languageButton: 'English'
      }
    };

    let currentLang = 'en';

    function switchLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });
    }

    document.getElementById('toggle-language').addEventListener('click', () => {
      const newLang = currentLang === 'en' ? 'he' : 'en';
      switchLanguage(newLang);
    });
  </script>
</body>
</html>
