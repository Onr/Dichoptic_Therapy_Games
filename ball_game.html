<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="manifest" href="manifest.json">
  <title>משחק – לחצו על הכדורים לפי המספרים</title>
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
      color: #fff; 
    }
    #gameCanvas { 
      display: block; 
      background: #1a1a2e; 
      box-shadow: none;
    }
    #message {
      position: absolute;
      top: 20px;
      right: 20px;
      font: 700 24px 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, rgba(42, 82, 152, 0.95), rgba(30, 60, 114, 0.95));
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    #controls {
      position: absolute;
      top: 20px;
      left: 20px;
      background: linear-gradient(135deg, rgba(42, 82, 152, 0.95), rgba(30, 60, 114, 0.95));
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      min-width: 200px;
    }
    
    .controls-header {
      padding: 1rem 1.5rem;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(42, 82, 152, 0.95), rgba(30, 60, 114, 0.95));
      border-radius: 16px 16px 0 0;
      transition: all 0.3s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #e0e6ff;
      font-weight: 600;
      user-select: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .controls-header:hover {
      background: linear-gradient(135deg, rgba(52, 92, 162, 0.95), rgba(40, 70, 124, 0.95));
    }
    
    .controls-header.collapsed {
      border-radius: 16px;
      border-bottom: none;
    }
    
    .controls-toggle {
      font-size: 1.2rem;
      transition: transform 0.3s ease;
      color: #e0e6ff;
    }
    
    .controls-header.collapsed .controls-toggle {
      transform: rotate(-90deg);
    }
    
    .controls-content {
      overflow: hidden;
      transition: max-height 0.3s ease-out, padding 0.3s ease-out;
      max-height: 1000px;
      padding: 20px;
    }
    
    .controls-content.collapsed {
      max-height: 0;
      padding: 0 20px;
    }

    @media (max-width: 759px) {
      #controls {
        top: 12px;
        left: 12px;
        min-width: 0;
        max-width: calc(100vw - 24px);
        z-index: 4;
      }

      .controls-header {
        min-height: 48px;
        padding: 0.75rem 1rem;
      }

      .controls-content {
        /* A deliberately bounded, scrollable sheet when the user opens it. */
        max-height: min(52svh, 420px);
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      #message {
        top: 72px;
        left: 12px;
        right: 12px;
        padding: 10px 12px;
        font-size: 1rem;
        line-height: 1.35;
        text-align: center;
      }
    }
    .control-group {
      margin-bottom: 20px;
    }
    .control-group:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
      color: #e0e6ff;
    }
    
    /* Modern Slider Styling */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
      outline: none;
      margin: 8px 0;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(79, 172, 254, 0.3);
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      transition: all 0.3s ease;
    }
    
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    
    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      transition: all 0.3s ease;
    }
    
    /* Modern Button Styling */
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      font-family: 'Segoe UI', sans-serif;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      margin: 4px 2px;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      background: linear-gradient(135deg, #5a6fd8 0%, #6b42a6 100%);
    }
    
    button:active {
      transform: translateY(0);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

	    #languageToggle {
	      position: absolute;
	      top: 90px;
	      right: 20px;
	      z-index: 2;
	      padding: 10px 20px;
	    }

	    #navButtons {
	      position: absolute;
	      inset-block-end: 20px;
	      inset-inline-start: 20px;
	      z-index: 3;
	      display: flex;
	      gap: 10px;
	    }

	    #navButtons button {
	      margin: 0;
	    }

    #celebration {
	      position: fixed;
	      top: 50%;
	      left: 50%;
	      transform: translate(-50%, -50%) scale(0.3);
      opacity: 0;
      width: 180px;
      height: 180px;
      pointer-events: none;
      display: none;
    }

    #celebration.visible {
      animation: celebrationPop 1.8s ease forwards;
    }

    #celebration svg {
      width: 100%;
      height: 100%;
    }

    #celebration text {
      font-size: 20px;
      font-family: 'Segoe UI', sans-serif;
      font-weight: bold;
      fill: #fff;
    }

    @keyframes celebrationPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3);
      }
      40% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      80% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.95);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3);
      }
    }

    /* Completion Modal */
    #completionModal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      justify-content: center;
      align-items: center;
    }
    #completionModal.visible {
      display: flex;
    }
    .modal-content {
      background: linear-gradient(135deg, rgba(42, 82, 152, 0.98), rgba(30, 60, 114, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 40px 48px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      max-width: 400px;
      width: 90%;
    }
    .modal-content h2 {
      margin: 0 0 12px;
      font-size: 28px;
      color: #ffe29f;
    }
    .modal-content p {
      margin: 0 0 28px;
      font-size: 18px;
      color: #e0e6ff;
    }
    .modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
	<body>
	  <div id="completionModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
	    <div class="modal-content">
	      <h2 id="modalTitle">🎉</h2>
	      <p id="modalMessage"></p>
	      <div class="modal-buttons">
	        <button id="modalPlayAgain" type="button"></button>
	        <button id="modalBackToHub" type="button" onclick="window.location.href='index.html'"></button>
	      </div>
	    </div>
	  </div>
	  <div id="message">לחצו על הכדורים בסדר עולה</div>
	  <button id="languageToggle" onclick="toggleLanguage()">English</button>
	  <div id="navButtons">
	    <button id="backButton" type="button" onclick="goBack()"></button>
	    <button id="quickRestartButton" type="button" onclick="initGame()"></button>
	  </div>
  <div id="celebration" aria-hidden="true" hidden>
	    <svg viewBox="0 0 160 160">
	      <defs>
	        <radialGradient id="celebrationGradient" cx="50%" cy="50%" r="75%">
          <stop offset="0%" stop-color="#ffe29f" />
          <stop offset="100%" stop-color="#ffa99f" />
        </radialGradient>
      </defs>
      <circle cx="80" cy="80" r="70" fill="url(#celebrationGradient)" opacity="0.7">
        <animate attributeName="r" values="50;70;55" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="80" cy="80" r="48" stroke="#fff" stroke-width="3" fill="none" stroke-dasharray="10 8">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 80 80" to="360 80 80" dur="2s" repeatCount="indefinite" />
      </circle>
      <text id="celebrationText" x="80" y="88" text-anchor="middle">!כל הכבוד</text>
      <g fill="#ffd166">
        <circle cx="20" cy="30" r="4">
          <animateTransform attributeName="transform" type="translate" values="0 0;4 -6;0 0" dur="1s" repeatCount="indefinite" />
        </circle>
        <circle cx="140" cy="35" r="3">
          <animateTransform attributeName="transform" type="translate" values="0 0;-5 -4;0 0" dur="1s" repeatCount="indefinite" />
        </circle>
        <circle cx="35" cy="130" r="3">
          <animateTransform attributeName="transform" type="translate" values="0 0;3 5;0 0" dur="1s" repeatCount="indefinite" />
        </circle>
        <circle cx="130" cy="120" r="4">
          <animateTransform attributeName="transform" type="translate" values="0 0;-4 4;0 0" dur="1s" repeatCount="indefinite" />
        </circle>
      </g>
    </svg>
  </div>
  <div id="controls">
    <button type="button" class="controls-header" aria-expanded="true" aria-controls="controls-content" onclick="toggleControls()">
      <span id="controlsHeaderText">הגדרות משחק</span>
      <span class="controls-toggle" aria-hidden="true">▼</span>
    </button>
    <div class="controls-content" id="controls-content">
      <div class="control-group">
        <label id="difficultyLabel">קושי:</label>
        <button id="difficultyStill" onclick="setDifficulty(0)">ללא תנועה</button>
        <button id="difficultySlow" onclick="setDifficulty(1.5)">איטי</button>
        <button id="difficultyFast" onclick="setDifficulty(4)">מהיר</button>
      </div>
      <div class="control-group">
        <label for="ballsSlider"><span id="ballsSliderText">מספר כדורים</span>: <span id="ballsLabel">7</span></label>
        <input type="range" id="ballsSlider" min="0" max="3" step="1" value="0">
      </div>
      <div class="control-group">
        <button id="restartButton" onclick="initGame()">התחל מחדש</button>
      </div>
      <div class="control-group">
          <label id="fontSizeLabel" for="fontSize">גודל גופן:</label>
          <input type="range" id="fontSize" min="10" max="50" value="26">
      </div>
      <div class="control-group">
        <label id="redBrightnessLabel" for="redBrightness">בהירות (אדום):</label>
        <input type="range" id="redBrightness" min="0" max="200" value="100">
        <label id="redContrastLabel" for="redContrast">ניגודיות (אדום):</label>
        <input type="range" id="redContrast" min="0" max="200" value="100">
      </div>
      <div class="control-group">
        <label id="rightBrightnessLabel" for="rightBrightness">בהירות (ירוק):</label>
        <input type="range" id="rightBrightness" min="0" max="200" value="100">
        <label id="rightContrastLabel" for="rightContrast">ניגודיות (ירוק):</label>
        <input type="range" id="rightContrast" min="0" max="200" value="100">
      </div>
      <div class="control-group">
        <button id="toggleColor">החלף ירוק ↔ כחול</button>
      </div>
    </div>
  </div>
  <canvas id="gameCanvas"></canvas>

  <script>
    const BALL_COUNTS = [7, 14, 21, 35];
    const BALL_RADIUS = 60;
    let SPEED         = 2.5;
    let FONT_SIZE     = 56;

    const translations = {
      he: {
        title: 'משחק – לחצו על הכדורים לפי המספרים',
        dir: 'rtl',
        instructionsRange: total => `לחצו על הכדורים בסדר: 1 - ${total}`,
        nextNumber: next => `נכון! עכשיו לחצו על: ${next}`,
        wrongOrder: (clicked, expected) => `לחצתם על ${clicked}, אבל הסדר הנכון הוא ${expected}.`,
        completed: 'כל הכבוד! סיימת את המשחק 🎉',
        controlsHeader: 'הגדרות משחק',
        difficultyLabel: 'קושי:',
        difficulties: {
          still: 'ללא תנועה',
          slow: 'איטי',
          fast: 'מהיר'
	        },
	        ballsSliderLabel: 'מספר כדורים',
	        back: 'חזרה',
	        restart: 'התחל מחדש',
	        fontSizeLabel: 'גודל גופן:',
	        brightness: 'בהירות',
	        contrast: 'ניגודיות',
        toggleColor: {
          green: 'החלף ירוק ↔ כחול',
          blue: 'החלף כחול ↔ ירוק'
        },
        colors: {
          red: 'אדום',
          green: 'ירוק',
          blue: 'כחול'
        },
        languageToggle: 'English',
        celebrationText: 'כל הכבוד!',
        playAgain: 'שחק שוב',
        backToHub: 'חזרה לתפריט'
      },
      en: {
        title: 'Game – Click the Balls in Order',
        dir: 'ltr',
        instructionsRange: total => `Press the balls in order: 1 - ${total}`,
        nextNumber: next => `Correct! Now click: ${next}`,
        wrongOrder: (clicked, expected) => `You clicked ${clicked}, but the correct next number is ${expected}.`,
        completed: 'Great job! You finished the game 🎉',
        controlsHeader: 'Game Settings',
        difficultyLabel: 'Difficulty:',
        difficulties: {
          still: 'Static',
          slow: 'Slow',
          fast: 'Fast'
	        },
	        ballsSliderLabel: 'Number of balls',
	        back: 'Back',
	        restart: 'Restart',
	        fontSizeLabel: 'Font size:',
	        brightness: 'Brightness',
	        contrast: 'Contrast',
        toggleColor: {
          green: 'Switch Green ↔ Blue',
          blue: 'Switch Blue ↔ Green'
        },
        colors: {
          red: 'Red',
          green: 'Green',
          blue: 'Blue'
        },
        languageToggle: 'עברית',
        celebrationText: 'Great job!',
        playAgain: 'Play Again',
        backToHub: 'Back to Hub'
      }
    };

    let currentLang = 'he';

    const canvas = document.getElementById('gameCanvas');
    const ctx    = canvas.getContext('2d');
    const msg    = document.getElementById('message');
    const ballsSlider = document.getElementById('ballsSlider');
    const ballsLabel  = document.getElementById('ballsLabel');
    const celebrationEl = document.getElementById('celebration');
    const redBrightnessSlider = document.getElementById('redBrightness');
    const redContrastSlider = document.getElementById('redContrast');
    const rightBrightnessSlider = document.getElementById('rightBrightness');
    const rightContrastSlider = document.getElementById('rightContrast');
    const rightBrightnessLabel = document.getElementById('rightBrightnessLabel');
    const rightContrastLabel = document.getElementById('rightContrastLabel');
    const fontSizeSlider = document.getElementById('fontSize');
    const controlsHeaderText = document.getElementById('controlsHeaderText');
    const difficultyLabel = document.getElementById('difficultyLabel');
    const difficultyStillBtn = document.getElementById('difficultyStill');
    const difficultySlowBtn = document.getElementById('difficultySlow');
    const difficultyFastBtn = document.getElementById('difficultyFast');
    const ballsSliderText = document.getElementById('ballsSliderText');
    const restartButton = document.getElementById('restartButton');
    const fontSizeLabel = document.getElementById('fontSizeLabel');
    const redBrightnessLabel = document.getElementById('redBrightnessLabel');
    const redContrastLabel = document.getElementById('redContrastLabel');
	    const toggleColorBtn = document.getElementById('toggleColor');
	    const languageToggleBtn = document.getElementById('languageToggle');
	    const celebrationText = document.getElementById('celebrationText');
	    const backButton = document.getElementById('backButton');
	    const quickRestartButton = document.getElementById('quickRestartButton');
	    const completionModal = document.getElementById('completionModal');
	    const modalMessage = document.getElementById('modalMessage');
	    const modalPlayAgain = document.getElementById('modalPlayAgain');
	    const modalBackToHub = document.getElementById('modalBackToHub');

    let balls, nextNumber, numBalls = BALL_COUNTS[ballsSlider.value];
    ballsLabel.textContent = numBalls;
    let rightColor = 'green';
    let feedbackTimeout;

    ballsSlider.addEventListener('input', () => {
      numBalls = BALL_COUNTS[ballsSlider.value];
      ballsLabel.textContent = numBalls;
      msg.textContent = translations[currentLang].instructionsRange(numBalls);
    });

    ballsSlider.addEventListener('change', initGame);

	    function applyLanguage() {
	      const t = translations[currentLang];
	      document.documentElement.lang = currentLang;
	      document.documentElement.dir = t.dir;
	      document.body.dir = t.dir;
	      document.title = t.title;
      controlsHeaderText.textContent = t.controlsHeader;
      difficultyLabel.textContent = t.difficultyLabel;
      difficultyStillBtn.textContent = t.difficulties.still;
      difficultySlowBtn.textContent = t.difficulties.slow;
      difficultyFastBtn.textContent = t.difficulties.fast;
	      ballsSliderText.textContent = t.ballsSliderLabel;
	      restartButton.textContent = t.restart;
	      backButton.textContent = t.back;
	      quickRestartButton.textContent = t.restart;
	      fontSizeLabel.textContent = t.fontSizeLabel;
	      languageToggleBtn.textContent = t.languageToggle;
      modalPlayAgain.textContent = t.playAgain;
	      modalBackToHub.textContent = t.backToHub;
	      updateColorLabels();
	      msg.textContent = t.instructionsRange(numBalls);
	    }

	    function goBack() {
	      try {
	        const hasReferrer = Boolean(document.referrer);
	        const sameOrigin = hasReferrer
	          && new URL(document.referrer).origin === window.location.origin;
	        if (sameOrigin) {
	          window.history.back();
	          return;
	        }
	      } catch (_) {
	        // Fall back to index navigation.
	      }
	      window.location.href = 'index.html';
	    }

	    function toggleLanguage() {
	      currentLang = currentLang === 'he' ? 'en' : 'he';
	      applyLanguage();
	      initGame();
	    }

    function updateColorLabels() {
      const t = translations[currentLang];
      redBrightnessLabel.textContent = `${t.brightness} (${t.colors.red})`;
      redContrastLabel.textContent = `${t.contrast} (${t.colors.red})`;
      const currentColorLabel = t.colors[rightColor];
      rightBrightnessLabel.textContent = `${t.brightness} (${currentColorLabel})`;
      rightContrastLabel.textContent = `${t.contrast} (${currentColorLabel})`;
      toggleColorBtn.textContent = t.toggleColor[rightColor];
    }

    function applyColorTransforms(color, brightness, contrast) {
      let r, g, b;
      if (color === 'red') {
        r = 255; g = 0; b = 0;
      } else if (color === 'blue') {
        r = 0; g = 0; b = 255;
      } else {
        r = 0; g = 128; b = 0;
      }

      r = r * (brightness / 100);
      g = g * (brightness / 100);
      b = b * (brightness / 100);

      const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
      r = factor * (r - 128) + 128;
      g = factor * (g - 128) + 128;
      b = factor * (b - 128) + 128;

      r = Math.max(0, Math.min(255, r));
      g = Math.max(0, Math.min(255, g));
      b = Math.max(0, Math.min(255, b));

      return `rgb(${r},${g},${b})`;
    }

    function setDifficulty(newSpeed) {
      SPEED = newSpeed;
      initGame();
    }

    function initGame() {
      if (feedbackTimeout) {
        clearTimeout(feedbackTimeout);
        feedbackTimeout = null;
      }
      completionModal.classList.remove('visible');
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      collapseControlsForCompactViewport();
      numBalls = BALL_COUNTS[ballsSlider.value];
      ballsLabel.textContent = numBalls;
      nextNumber = 1;
      msg.textContent = translations[currentLang].instructionsRange(numBalls);
      msg.style.borderColor = 'rgba(255, 255, 255, 0.2)';

      if (window.UserCounter) {
        window.UserCounter.recordGameStart('Ball Game (Tracking)', `${numBalls} balls`);
      }

      const numbers = Array.from({ length: numBalls }, (_, i) => i + 1);
      shuffle(numbers);

      balls = numbers.map(n => ({
        num: n,
        color: Math.random() < 0.5 ? 'red' : 'green',
        ...createSafeTargetPosition(),
        vx:    (Math.random() * 2 - 1) * SPEED,
        vy:    (Math.random() * 2 - 1) * SPEED,
        clicked: false
      }));

      if (!animationFrameId) {
        loop();
      }
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function toggleRightColor() {
      rightColor = rightColor === 'green' ? 'blue' : 'green';
      updateColorLabels();
      if (!animationFrameId) loop();
    }

    function toggleControls() {
      const header = document.querySelector('.controls-header');
      const content = document.getElementById('controls-content');
      
      header.classList.toggle('collapsed');
      content.classList.toggle('collapsed');
      const isExpanded = !header.classList.contains('collapsed');
      header.setAttribute('aria-expanded', String(isExpanded));
      content.setAttribute('aria-hidden', String(!isExpanded));
    }

    function setControlsCollapsed(collapsed) {
      const header = document.querySelector('.controls-header');
      const content = document.getElementById('controls-content');
      header.classList.toggle('collapsed', collapsed);
      content.classList.toggle('collapsed', collapsed);
      header.setAttribute('aria-expanded', String(!collapsed));
      content.setAttribute('aria-hidden', String(collapsed));
    }

    function collapseControlsForCompactViewport() {
      if (window.matchMedia('(max-width: 759px)').matches) {
        setControlsCollapsed(true);
      }
    }

    function createSafeTargetPosition() {
      // Keep targets away from the permanent controls (left) and status UI (top).
      // On phones the settings drawer is collapsed after the first interaction,
      // so retain a simple edge inset rather than creating an impossibly small area.
      const isCompact = window.innerWidth < 760;
      const minX = Math.min(canvas.width - BALL_RADIUS, isCompact ? BALL_RADIUS + 16 : 280);
      const maxX = Math.max(minX, canvas.width - BALL_RADIUS - 20);
      const minY = Math.min(canvas.height - BALL_RADIUS, isCompact ? BALL_RADIUS + 155 : BALL_RADIUS + 100);
      const maxY = Math.max(minY, canvas.height - BALL_RADIUS - 88);
      return {
        x: minX + Math.random() * (maxX - minX),
        y: minY + Math.random() * (maxY - minY)
      };
    }

    function drawSpaceship(x, y, radius, angle, color) {
      // A single, solid therapeutic target. It deliberately has no outline,
      // label, gradient, glow, or second colour.
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(-radius * 0.42, -radius * 0.56);
      ctx.lineTo(-radius * 0.26, -radius * 0.18);
      ctx.lineTo(-radius * 0.72, -radius * 0.34);
      ctx.lineTo(-radius * 0.58, 0);
      ctx.lineTo(-radius * 0.72, radius * 0.34);
      ctx.lineTo(-radius * 0.26, radius * 0.18);
      ctx.lineTo(-radius * 0.42, radius * 0.56);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }

    let animationFrameId;
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let allClicked = true;
      for (let ball of balls) {
        if (!ball.clicked) {
          allClicked = false;
          ball.x += ball.vx;
          ball.y += ball.vy;

          const leftEdge = window.innerWidth < 760 ? BALL_RADIUS + 16 : 280;
          const rightEdge = canvas.width - BALL_RADIUS - 20;
          if (ball.x < leftEdge || ball.x > rightEdge) ball.vx *= -1;
          const topEdge = window.innerWidth < 760 ? BALL_RADIUS + 155 : BALL_RADIUS + 100;
          if (ball.y < topEdge || ball.y + BALL_RADIUS > canvas.height - 80) ball.vy *= -1;

          let targetColor;
          if (ball.color === 'red') {
            targetColor = applyColorTransforms('red', redBrightnessSlider.value, redContrastSlider.value);
          } else {
            targetColor = applyColorTransforms(rightColor, rightBrightnessSlider.value, rightContrastSlider.value);
          }
          drawSpaceship(ball.x, ball.y, BALL_RADIUS, Math.atan2(ball.vy, ball.vx), targetColor);
        }
      }

      if (!allClicked) {
        animationFrameId = requestAnimationFrame(loop);
      } else {
        msg.textContent = translations[currentLang].completed;
        showCompletionModal();
        animationFrameId = null;
        
        if (window.UserCounter) {
          window.UserCounter.recordGameCompletion('Ball Game (Tracking)', {
            ballCount: numBalls,
            completed: true
          });
        }
      }
    }

    function showCompletionModal() {
      const t = translations[currentLang];
      modalMessage.textContent = t.completed;
      completionModal.classList.add('visible');
      modalPlayAgain.focus();
    }

    modalPlayAgain.addEventListener('click', () => {
      completionModal.classList.remove('visible');
      initGame();
    });

    function showInlineFeedback(text) {
      if (feedbackTimeout) clearTimeout(feedbackTimeout);
      msg.textContent = text;
      msg.style.borderColor = 'rgba(255, 160, 80, 0.6)';
      feedbackTimeout = setTimeout(() => {
        msg.textContent = translations[currentLang].instructionsRange(numBalls);
        msg.style.borderColor = 'rgba(255, 255, 255, 0.2)';
      }, 2000);
    }

    function handlePointerDown(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX || e.touches[0].clientX) - rect.left;
      const my = (e.clientY || e.touches[0].clientY) - rect.top;

      for (let ball of balls) {
        if (!ball.clicked) {
          const dx = mx - ball.x;
          const dy = my - ball.y;
          if (dx * dx + dy * dy <= BALL_RADIUS * BALL_RADIUS) {
            autoCollapseSettings();
            
            if (ball.num === nextNumber) {
              ball.clicked = true;
              nextNumber++;
              if (nextNumber <= numBalls) {
                msg.textContent = translations[currentLang].nextNumber(nextNumber);
              }
            } else {
              showInlineFeedback(translations[currentLang].wrongOrder(ball.num, nextNumber));
            }
            break;
          }
        }
      }
    };

    function autoCollapseSettings() {
      setControlsCollapsed(true);
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('touchstart', handlePointerDown, { passive: false });

    ['input', 'change'].forEach(eventName => {
      redBrightnessSlider.addEventListener(eventName, () => !animationFrameId && loop());
      redContrastSlider.addEventListener(eventName, () => !animationFrameId && loop());
      rightBrightnessSlider.addEventListener(eventName, () => !animationFrameId && loop());
      rightContrastSlider.addEventListener(eventName, () => !animationFrameId && loop());
      fontSizeSlider.addEventListener(eventName, () => {
        FONT_SIZE = fontSizeSlider.value;
        if (!animationFrameId) loop();
      });
    });

    toggleColorBtn.addEventListener('click', toggleRightColor);
    window.addEventListener('resize', initGame);

    applyLanguage();
    initGame();
  </script>
  
  <!-- User Tracking -->
  <script src="src/utils/userCounter.js"></script>
</body>
</html>
