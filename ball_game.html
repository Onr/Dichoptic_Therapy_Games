<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="manifest" href="manifest.json">
  <title>משחק – לחצו על הכדורים לפי המספרים</title>
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
      color: #fff; 
    }
    #gameCanvas { 
      display: block; 
      background: #1a1a2e; 
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
    }
    #message {
      position: absolute;
      top: 20px;
      right: 20px;
      font: 700 24px 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, rgba(42, 82, 152, 0.95), rgba(30, 60, 114, 0.95));
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: background 0.2s ease;
    }

    /* Non-blocking wrong-click feedback (replaces the blocking alert()) */
    #message.error {
      background: linear-gradient(135deg, rgba(190, 45, 45, 0.95), rgba(130, 25, 25, 0.95));
      animation: messageShake 0.4s;
    }

    @keyframes messageShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-4px); }
    }
    #controls {
      position: absolute;
      top: 20px;
      left: 20px;
      background: linear-gradient(135deg, rgba(42, 82, 152, 0.95), rgba(30, 60, 114, 0.95));
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      min-width: 200px;
    }
    
    .controls-header {
      padding: 1rem 1.5rem;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(42, 82, 152, 0.95), rgba(30, 60, 114, 0.95));
      border-radius: 16px 16px 0 0;
      transition: all 0.3s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #e0e6ff;
      font-weight: 600;
      user-select: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .controls-header:hover {
      background: linear-gradient(135deg, rgba(52, 92, 162, 0.95), rgba(40, 70, 124, 0.95));
    }
    
    .controls-header.collapsed {
      border-radius: 16px;
      border-bottom: none;
    }
    
    .controls-toggle {
      font-size: 1.2rem;
      transition: transform 0.3s ease;
      color: #e0e6ff;
    }
    
    .controls-header.collapsed .controls-toggle {
      transform: rotate(-90deg);
    }
    
    .controls-content {
      overflow: hidden;
      transition: max-height 0.3s ease-out, padding 0.3s ease-out;
      max-height: 1000px;
      padding: 20px;
    }
    
    .controls-content.collapsed {
      max-height: 0;
      padding: 0 20px;
    }
    .control-group {
      margin-bottom: 20px;
    }
    .control-group:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
      color: #e0e6ff;
    }
    
    /* Modern Slider Styling */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
      outline: none;
      margin: 8px 0;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(79, 172, 254, 0.3);
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      transition: all 0.3s ease;
    }
    
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    
    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      transition: all 0.3s ease;
    }
    
    /* Modern Button Styling */
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      font-family: 'Segoe UI', sans-serif;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      margin: 4px 2px;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      background: linear-gradient(135deg, #5a6fd8 0%, #6b42a6 100%);
    }
    
    button:active {
      transform: translateY(0);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    /* Keyboard focus visibility for accessibility */
    button:focus-visible,
    input[type="range"]:focus-visible,
    .controls-header:focus-visible {
      outline: 3px solid #ffd166;
      outline-offset: 2px;
    }

	    #languageToggle {
	      position: absolute;
	      top: 90px;
	      right: 20px;
	      z-index: 2;
	      padding: 10px 20px;
	    }

	    #navButtons {
	      position: absolute;
	      inset-block-end: 20px;
	      inset-inline-start: 20px;
	      z-index: 3;
	      display: flex;
	      gap: 10px;
	    }

	    #navButtons button {
	      margin: 0;
	    }

	    #celebration {
	      position: fixed;
	      top: 50%;
	      left: 50%;
	      transform: translate(-50%, -50%) scale(0.3);
      opacity: 0;
      width: 180px;
      height: 180px;
      pointer-events: none;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.45));
    }

    #celebration.visible {
      animation: celebrationPop 1.8s ease forwards;
    }

    #celebration svg {
      width: 100%;
      height: 100%;
    }

    #celebration text {
      font-size: 20px;
      font-family: 'Segoe UI', sans-serif;
      font-weight: bold;
      fill: #fff;
    }

    @keyframes celebrationPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3);
      }
      40% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      80% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.95);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3);
      }
    }
  </style>
</head>
	<body>
	  <div id="message" aria-live="polite">לחצו על הכדורים בסדר עולה</div>
	  <button id="languageToggle" onclick="toggleLanguage()">English</button>
	  <div id="navButtons">
	    <button id="backButton" type="button" onclick="goBack()"></button>
	    <button id="quickRestartButton" type="button" onclick="initGame()"></button>
	    <button id="pauseButton" type="button" onclick="togglePause()" aria-pressed="false"></button>
	  </div>
	  <div id="celebration" aria-hidden="true">
	    <svg viewBox="0 0 160 160">
	      <defs>
	        <radialGradient id="celebrationGradient" cx="50%" cy="50%" r="75%">
          <stop offset="0%" stop-color="#ffe29f" />
          <stop offset="100%" stop-color="#ffa99f" />
        </radialGradient>
      </defs>
      <circle cx="80" cy="80" r="70" fill="url(#celebrationGradient)" opacity="0.7">
        <animate attributeName="r" values="50;70;55" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="80" cy="80" r="48" stroke="#fff" stroke-width="3" fill="none" stroke-dasharray="10 8">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 80 80" to="360 80 80" dur="2s" repeatCount="indefinite" />
      </circle>
      <text id="celebrationText" x="80" y="88" text-anchor="middle">!כל הכבוד</text>
      <g fill="#ffd166">
        <circle cx="20" cy="30" r="4">
          <animateTransform attributeName="transform" type="translate" values="0 0;4 -6;0 0" dur="1s" repeatCount="indefinite" />
        </circle>
        <circle cx="140" cy="35" r="3">
          <animateTransform attributeName="transform" type="translate" values="0 0;-5 -4;0 0" dur="1s" repeatCount="indefinite" />
        </circle>
        <circle cx="35" cy="130" r="3">
          <animateTransform attributeName="transform" type="translate" values="0 0;3 5;0 0" dur="1s" repeatCount="indefinite" />
        </circle>
        <circle cx="130" cy="120" r="4">
          <animateTransform attributeName="transform" type="translate" values="0 0;-4 4;0 0" dur="1s" repeatCount="indefinite" />
        </circle>
      </g>
    </svg>
  </div>
  <div id="controls">
    <div class="controls-header" onclick="toggleControls()" tabindex="0" role="button" aria-expanded="true" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleControls()}">
      <span id="controlsHeaderText">הגדרות משחק</span>
      <span class="controls-toggle">▼</span>
    </div>
    <div class="controls-content" id="controls-content">
      <div class="control-group">
        <label id="difficultyLabel">קושי:</label>
        <button id="difficultyStill" onclick="setDifficulty(0)">ללא תנועה</button>
        <button id="difficultySlow" onclick="setDifficulty(1.5)">איטי</button>
        <button id="difficultyFast" onclick="setDifficulty(4)">מהיר</button>
      </div>
      <div class="control-group">
        <label for="ballsSlider"><span id="ballsSliderText">מספר כדורים</span>: <span id="ballsLabel">7</span></label>
        <input type="range" id="ballsSlider" min="0" max="3" step="1" value="0">
      </div>
      <div class="control-group">
        <button id="restartButton" onclick="initGame()">התחל מחדש</button>
      </div>
      <div class="control-group">
          <label id="fontSizeLabel" for="fontSize">גודל גופן:</label>
          <input type="range" id="fontSize" min="10" max="50" value="26">
      </div>
      <div class="control-group">
        <label id="redBrightnessLabel" for="redBrightness">בהירות (אדום):</label>
        <input type="range" id="redBrightness" min="0" max="200" value="100">
        <label id="redContrastLabel" for="redContrast">ניגודיות (אדום):</label>
        <input type="range" id="redContrast" min="0" max="200" value="100">
      </div>
      <div class="control-group">
        <label id="rightBrightnessLabel" for="rightBrightness">בהירות (ירוק):</label>
        <input type="range" id="rightBrightness" min="0" max="200" value="100">
        <label id="rightContrastLabel" for="rightContrast">ניגודיות (ירוק):</label>
        <input type="range" id="rightContrast" min="0" max="200" value="100">
      </div>
      <div class="control-group">
        <button id="toggleColor">החלף ירוק ↔ כחול</button>
      </div>
    </div>
  </div>
  <canvas id="gameCanvas"></canvas>

  <script>
    const BALL_COUNTS = [7, 14, 21, 35];
    let BALL_RADIUS   = 60;
    let SPEED         = 2.5;
    let FONT_SIZE     = 56;

    // Logical (CSS-pixel) drawing size. Kept separate from canvas.width/height
    // because the backing store is scaled by devicePixelRatio for crisp mobile
    // rendering. All game logic uses viewW/viewH, never canvas.width/height.
    let viewW = window.innerWidth;
    let viewH = window.innerHeight;

    // Scale the ball size to the screen so balls actually fit on phones,
    // where a fixed 60px radius filled a third of the display.
    function computeSizes() {
      const minDim = Math.min(viewW, viewH);
      BALL_RADIUS = Math.round(Math.max(20, Math.min(60, minDim * 0.09)));
      FONT_SIZE   = Math.round(BALL_RADIUS * 0.9);
    }

    // Size the canvas to the visual viewport, accounting for devicePixelRatio.
    function resizeCanvas() {
      viewW = window.innerWidth;
      viewH = window.innerHeight;
      const dpr = window.devicePixelRatio || 1;
      canvas.style.width  = viewW + 'px';
      canvas.style.height = viewH + 'px';
      canvas.width  = Math.round(viewW * dpr);
      canvas.height = Math.round(viewH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      computeSizes();
    }

    const translations = {
      he: {
        title: 'משחק – לחצו על הכדורים לפי המספרים',
        dir: 'rtl',
        instructionsRange: total => `לחצו על הכדורים בסדר: 1 - ${total}`,
        nextNumber: next => `נכון! עכשיו לחצו על: ${next}`,
        wrongOrder: (clicked, expected) => `לחצתם על ${clicked}, אבל הסדר הנכון הוא ${expected}.`,
        completed: 'כל הכבוד! סיימת את המשחק 🎉',
        controlsHeader: 'הגדרות משחק',
        difficultyLabel: 'קושי:',
        difficulties: {
          still: 'ללא תנועה',
          slow: 'איטי',
          fast: 'מהיר'
	        },
	        ballsSliderLabel: 'מספר כדורים',
	        back: 'חזרה',
	        restart: 'התחל מחדש',
	        fontSizeLabel: 'גודל גופן:',
	        brightness: 'בהירות',
	        contrast: 'ניגודיות',
        toggleColor: {
          green: 'החלף ירוק ↔ כחול',
          blue: 'החלף כחול ↔ ירוק'
        },
        colors: {
          red: 'אדום',
          green: 'ירוק',
          blue: 'כחול'
        },
        languageToggle: 'English',
        celebrationText: 'כל הכבוד!',
        pause: 'השהה',
        resume: 'המשך',
        paused: 'המשחק מושהה'
      },
      en: {
        title: 'Game – Click the Balls in Order',
        dir: 'ltr',
        instructionsRange: total => `Press the balls in order: 1 - ${total}`,
        nextNumber: next => `Correct! Now click: ${next}`,
        wrongOrder: (clicked, expected) => `You clicked ${clicked}, but the correct next number is ${expected}.`,
        completed: 'Great job! You finished the game 🎉',
        controlsHeader: 'Game Settings',
        difficultyLabel: 'Difficulty:',
        difficulties: {
          still: 'Static',
          slow: 'Slow',
          fast: 'Fast'
	        },
	        ballsSliderLabel: 'Number of balls',
	        back: 'Back',
	        restart: 'Restart',
	        fontSizeLabel: 'Font size:',
	        brightness: 'Brightness',
	        contrast: 'Contrast',
        toggleColor: {
          green: 'Switch Green ↔ Blue',
          blue: 'Switch Blue ↔ Green'
        },
        colors: {
          red: 'Red',
          green: 'Green',
          blue: 'Blue'
        },
        languageToggle: 'עברית',
        celebrationText: 'Great job!',
        pause: 'Pause',
        resume: 'Resume',
        paused: 'Game paused'
      }
    };

    let currentLang = 'he';

    const canvas = document.getElementById('gameCanvas');
    const ctx    = canvas.getContext('2d');
    const msg    = document.getElementById('message');
    const ballsSlider = document.getElementById('ballsSlider');
    const ballsLabel  = document.getElementById('ballsLabel');
    const celebrationEl = document.getElementById('celebration');
    const redBrightnessSlider = document.getElementById('redBrightness');
    const redContrastSlider = document.getElementById('redContrast');
    const rightBrightnessSlider = document.getElementById('rightBrightness');
    const rightContrastSlider = document.getElementById('rightContrast');
    const rightBrightnessLabel = document.getElementById('rightBrightnessLabel');
    const rightContrastLabel = document.getElementById('rightContrastLabel');
    const fontSizeSlider = document.getElementById('fontSize');
    const controlsHeaderText = document.getElementById('controlsHeaderText');
    const difficultyLabel = document.getElementById('difficultyLabel');
    const difficultyStillBtn = document.getElementById('difficultyStill');
    const difficultySlowBtn = document.getElementById('difficultySlow');
    const difficultyFastBtn = document.getElementById('difficultyFast');
    const ballsSliderText = document.getElementById('ballsSliderText');
    const restartButton = document.getElementById('restartButton');
    const fontSizeLabel = document.getElementById('fontSizeLabel');
    const redBrightnessLabel = document.getElementById('redBrightnessLabel');
    const redContrastLabel = document.getElementById('redContrastLabel');
	    const toggleColorBtn = document.getElementById('toggleColor');
	    const languageToggleBtn = document.getElementById('languageToggle');
	    const celebrationText = document.getElementById('celebrationText');
	    const backButton = document.getElementById('backButton');
	    const quickRestartButton = document.getElementById('quickRestartButton');

    let balls, nextNumber, numBalls = BALL_COUNTS[ballsSlider.value];
    ballsLabel.textContent = numBalls;
    let rightColor = 'green';
    let celebrationTimeout;
    let gameStartTime = 0;
    let gameTimer = 0;
    let timerInterval = null;
    let isPaused = false;
    let pauseStartTime = 0;
    let gameFinished = false;
    let wrongFeedbackTimeout = null;

    function runTimerInterval() {
      timerInterval = setInterval(() => {
        gameTimer = Math.floor((Date.now() - gameStartTime) / 1000);
      }, 1000);
    }

    function startTimer() {
      gameStartTime = Date.now();
      runTimerInterval();
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    ballsSlider.addEventListener('input', () => {
      numBalls = BALL_COUNTS[ballsSlider.value];
      ballsLabel.textContent = numBalls;
      msg.textContent = translations[currentLang].instructionsRange(numBalls);
    });

    ballsSlider.addEventListener('change', initGame);

	    function applyLanguage() {
	      const t = translations[currentLang];
	      document.documentElement.lang = currentLang;
	      document.documentElement.dir = t.dir;
	      document.body.dir = t.dir;
	      document.title = t.title;
      controlsHeaderText.textContent = t.controlsHeader;
      difficultyLabel.textContent = t.difficultyLabel;
      difficultyStillBtn.textContent = t.difficulties.still;
      difficultySlowBtn.textContent = t.difficulties.slow;
      difficultyFastBtn.textContent = t.difficulties.fast;
	      ballsSliderText.textContent = t.ballsSliderLabel;
	      restartButton.textContent = t.restart;
	      backButton.textContent = t.back;
	      quickRestartButton.textContent = t.restart;
	      fontSizeLabel.textContent = t.fontSizeLabel;
	      languageToggleBtn.textContent = t.languageToggle;
	      celebrationText.textContent = t.celebrationText;
	      updatePauseButton();
	      updateColorLabels();
	      msg.textContent = t.instructionsRange(numBalls);
	    }

	    function goBack() {
	      try {
	        const hasReferrer = Boolean(document.referrer);
	        const sameOrigin = hasReferrer
	          && new URL(document.referrer).origin === window.location.origin;
	        if (sameOrigin) {
	          window.history.back();
	          return;
	        }
	      } catch (_) {
	        // Fall back to index navigation.
	      }
	      window.location.href = 'index.html';
	    }

	    function toggleLanguage() {
	      currentLang = currentLang === 'he' ? 'en' : 'he';
	      applyLanguage();
	      initGame();
	    }

    function updateColorLabels() {
      const t = translations[currentLang];
      redBrightnessLabel.textContent = `${t.brightness} (${t.colors.red})`;
      redContrastLabel.textContent = `${t.contrast} (${t.colors.red})`;
      const currentColorLabel = t.colors[rightColor];
      rightBrightnessLabel.textContent = `${t.brightness} (${currentColorLabel})`;
      rightContrastLabel.textContent = `${t.contrast} (${currentColorLabel})`;
      toggleColorBtn.textContent = t.toggleColor[rightColor];
    }

    function applyColorTransforms(color, brightness, contrast) {
      let r, g, b;
      if (color === 'red') {
        r = 255; g = 0; b = 0;
      } else if (color === 'blue') {
        r = 0; g = 0; b = 255;
      } else {
        r = 0; g = 128; b = 0;
      }

      r = r * (brightness / 100);
      g = g * (brightness / 100);
      b = b * (brightness / 100);

      const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
      r = factor * (r - 128) + 128;
      g = factor * (g - 128) + 128;
      b = factor * (b - 128) + 128;

      r = Math.max(0, Math.min(255, r));
      g = Math.max(0, Math.min(255, g));
      b = Math.max(0, Math.min(255, b));

      return `rgb(${r},${g},${b})`;
    }

    function setDifficulty(newSpeed) {
      SPEED = newSpeed;
      initGame();
    }

    function initGame() {
      stopTimer();
      startTimer();
      isPaused = false;
      gameFinished = false;
      lastFrameTime = null;
      clearWrongClickFeedback();
      updatePauseButton();
      if (celebrationTimeout) {
        clearTimeout(celebrationTimeout);
        celebrationTimeout = null;
      }
      celebrationEl.classList.remove('visible');
      resizeCanvas();
      numBalls = BALL_COUNTS[ballsSlider.value];
      ballsLabel.textContent = numBalls;
      nextNumber = 1;
      msg.textContent = translations[currentLang].instructionsRange(numBalls);

      if (window.UserCounter) {
        window.UserCounter.recordGameStart('Ball Game (Tracking)', `${numBalls} balls`);
      }

      const numbers = Array.from({ length: numBalls }, (_, i) => i + 1);
      shuffle(numbers);

      balls = numbers.map(n => ({
        num:   n,
        color: Math.random() < 0.5 ? 'red' : 'green',
        x:     Math.random() * (viewW - 2 * BALL_RADIUS) + BALL_RADIUS,
        y:     Math.random() * (viewH - 2 * BALL_RADIUS) + BALL_RADIUS,
        vx:    (Math.random() * 2 - 1) * SPEED,
        vy:    (Math.random() * 2 - 1) * SPEED,
        clicked: false
      }));

      if (!animationFrameId) {
        loop();
      }
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function toggleRightColor() {
      rightColor = rightColor === 'green' ? 'blue' : 'green';
      updateColorLabels();
      if (!animationFrameId) loop();
    }

    function toggleControls() {
      const header = document.querySelector('.controls-header');
      const content = document.getElementById('controls-content');
      
      header.classList.toggle('collapsed');
      content.classList.toggle('collapsed');
      header.setAttribute('aria-expanded', String(!header.classList.contains('collapsed')));
    }

    function updatePauseButton() {
      const btn = document.getElementById('pauseButton');
      btn.textContent = isPaused
        ? '▶ ' + translations[currentLang].resume
        : '⏸ ' + translations[currentLang].pause;
      btn.setAttribute('aria-pressed', String(isPaused));
    }

    function togglePause() {
      if (gameFinished) { return; }

      isPaused = !isPaused;
      if (isPaused) {
        pauseStartTime = Date.now();
        stopTimer();
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }
        msg.textContent = translations[currentLang].paused;
      } else {
        // Shift the start time forward so paused time doesn't count.
        gameStartTime += Date.now() - pauseStartTime;
        runTimerInterval();
        msg.textContent = nextNumber === 1
          ? translations[currentLang].instructionsRange(numBalls)
          : translations[currentLang].nextNumber(nextNumber);
        lastFrameTime = null;
        if (!animationFrameId) { loop(); }
      }
      updatePauseButton();
    }

    // Auto-pause when the tab/app goes to the background so the timer doesn't
    // keep counting while the player isn't looking.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && !isPaused && !gameFinished) {
        togglePause();
      }
    });

    let animationFrameId;
    // Movement is normalized to a 60fps time step so ball speed is identical
    // on 60Hz and 120Hz screens (and doesn't slow down when frames drop).
    let lastFrameTime = null;
    function loop(timestamp) {
      // While paused, direct loop() calls (slider/color changes) must only
      // redraw the frozen scene, never advance it.
      let dt = isPaused ? 0 : 1;
      if (typeof timestamp === 'number') {
        if (lastFrameTime !== null && !isPaused) {
          dt = Math.min(3, (timestamp - lastFrameTime) / (1000 / 60));
        }
        lastFrameTime = timestamp;
      }

      ctx.clearRect(0, 0, viewW, viewH);

      let allClicked = true;
      for (let ball of balls) {
        if (!ball.clicked) {
          allClicked = false;
          ball.x += ball.vx * dt;
          ball.y += ball.vy * dt;

          // Bounce and clamp back inside so a ball can never get stuck
          // jittering in a wall after spawning or resizing near an edge.
          if (ball.x - BALL_RADIUS < 0) {
            ball.x = BALL_RADIUS;
            ball.vx = Math.abs(ball.vx);
          } else if (ball.x + BALL_RADIUS > viewW) {
            ball.x = viewW - BALL_RADIUS;
            ball.vx = -Math.abs(ball.vx);
          }
          if (ball.y - BALL_RADIUS < 0) {
            ball.y = BALL_RADIUS;
            ball.vy = Math.abs(ball.vy);
          } else if (ball.y + BALL_RADIUS > viewH) {
            ball.y = viewH - BALL_RADIUS;
            ball.vy = -Math.abs(ball.vy);
          }

          ctx.beginPath();
          ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
          if (ball.color === 'red') {
            ctx.fillStyle = applyColorTransforms('red', redBrightnessSlider.value, redContrastSlider.value);
          } else {
            ctx.fillStyle = applyColorTransforms(rightColor, rightBrightnessSlider.value, rightContrastSlider.value);
          }
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = 'white';
          ctx.font = `${FONT_SIZE}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(ball.num, ball.x, ball.y);
        }
      }

      if (!allClicked) {
        if (!isPaused) {
          animationFrameId = requestAnimationFrame(loop);
        }
      } else {
        animationFrameId = null;
        // Run the completion side effects only once. loop() is also invoked
        // directly by the slider/color handlers to redraw after the game
        // ends, and without this guard each of those re-triggered the
        // celebration and re-recorded the completion.
        if (!gameFinished) {
          gameFinished = true;
          stopTimer();
          msg.textContent = translations[currentLang].completed;
          triggerCelebration();

          if (window.UserCounter) {
            window.UserCounter.recordGameCompletion('Ball Game (Tracking)', {
              ballCount: numBalls,
              time: gameTimer,
              completed: true
            });
          }

          if (window.AlertSystem) {
            window.AlertSystem.gameOver(
              { time: gameTimer, score: numBalls, moves: numBalls },
              () => initGame(),
              () => window.location.href = 'index.html'
            );
          }
        }
      }
    }

    function triggerCelebration() {
      celebrationEl.classList.remove('visible');
      void celebrationEl.offsetWidth;
      celebrationEl.classList.add('visible');
      if (celebrationTimeout) {
        clearTimeout(celebrationTimeout);
      }
      celebrationTimeout = setTimeout(() => {
        celebrationEl.classList.remove('visible');
      }, 2000);
    }

    // Show the wrong-click message inline instead of a blocking alert() —
    // alerts froze the animation and are jarring on mobile.
    function showWrongClickFeedback(clickedNum) {
      msg.textContent = translations[currentLang].wrongOrder(clickedNum, nextNumber);
      msg.classList.add('error');
      clearTimeout(wrongFeedbackTimeout);
      wrongFeedbackTimeout = setTimeout(() => {
        clearWrongClickFeedback();
        msg.textContent = nextNumber === 1
          ? translations[currentLang].instructionsRange(numBalls)
          : translations[currentLang].nextNumber(nextNumber);
      }, 2000);
    }

    function clearWrongClickFeedback() {
      clearTimeout(wrongFeedbackTimeout);
      wrongFeedbackTimeout = null;
      msg.classList.remove('error');
    }

    function handlePointerDown(e) {
      if (isPaused || gameFinished) { return; }
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX || e.touches[0].clientX) - rect.left;
      const my = (e.clientY || e.touches[0].clientY) - rect.top;

      for (let ball of balls) {
        if (!ball.clicked) {
          const dx = mx - ball.x;
          const dy = my - ball.y;
          if (dx * dx + dy * dy <= BALL_RADIUS * BALL_RADIUS) {
            autoCollapseSettings();

            if (ball.num === nextNumber) {
              ball.clicked = true;
              nextNumber++;
              clearWrongClickFeedback();
              if (nextNumber <= numBalls) {
                msg.textContent = translations[currentLang].nextNumber(nextNumber);
              }
            } else {
              showWrongClickFeedback(ball.num);
            }
            break;
          }
        }
      }
    };

    function autoCollapseSettings() {
      const header = document.querySelector('.controls-header');
      const content = document.getElementById('controls-content');
      
      if (!header.classList.contains('collapsed')) {
        header.classList.add('collapsed');
        content.classList.add('collapsed');
      }
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('touchstart', handlePointerDown, { passive: false });

    ['input', 'change'].forEach(eventName => {
      redBrightnessSlider.addEventListener(eventName, () => !animationFrameId && loop());
      redContrastSlider.addEventListener(eventName, () => !animationFrameId && loop());
      rightBrightnessSlider.addEventListener(eventName, () => !animationFrameId && loop());
      rightContrastSlider.addEventListener(eventName, () => !animationFrameId && loop());
      fontSizeSlider.addEventListener(eventName, () => {
        FONT_SIZE = fontSizeSlider.value;
        if (!animationFrameId) loop();
      });
    });

    toggleColorBtn.addEventListener('click', toggleRightColor);

    // Resize without resetting the game. On mobile the address bar showing/hiding
    // fires 'resize' constantly; re-running initGame there reset progress and made
    // the board appear to jump/resize. Instead, resize the canvas, recompute the
    // ball size, and clamp existing balls back into the visible area.
    let resizeTimer;
    function handleResize() {
      resizeCanvas();
      for (const ball of balls) {
        ball.x = Math.min(Math.max(ball.x, BALL_RADIUS), viewW - BALL_RADIUS);
        ball.y = Math.min(Math.max(ball.y, BALL_RADIUS), viewH - BALL_RADIUS);
      }
      if (!animationFrameId) loop();
    }
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(handleResize, 150);
    });
    window.addEventListener('orientationchange', () => setTimeout(handleResize, 200));

    applyLanguage();
    initGame();
  </script>
  
  <!-- Production Utilities -->
  <script src="src/utils/environment.js"></script>
  <script src="src/utils/logger.js"></script>
  <script src="src/utils/errorHandler.js"></script>
  <script src="src/utils/alerts.js"></script>
  <script src="src/utils/performance.js"></script>
  <script src="src/utils/health.js"></script>
  <script src="src/utils/userCounter.js"></script>
  <script src="src/utils/adminPanel.js"></script>
  <script src="src/production.js"></script>
</body>
