<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>משחק – לחצו על הכדורים לפי המספרים</title>
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
      color: #fff; 
    }
    #gameCanvas { 
      display: block; 
      background: #1a1a2e; 
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
    }
    #message {
      position: absolute;
      top: 20px;
      right: 20px;
      font: 700 24px 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, rgba(42, 82, 152, 0.95), rgba(30, 60, 114, 0.95));
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    #controls {
      position: absolute;
      top: 20px;
      left: 20px;
      background: linear-gradient(135deg, rgba(42, 82, 152, 0.95), rgba(30, 60, 114, 0.95));
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      min-width: 200px;
    }
    
    .controls-header {
      padding: 1rem 1.5rem;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(42, 82, 152, 0.95), rgba(30, 60, 114, 0.95));
      border-radius: 16px 16px 0 0;
      transition: all 0.3s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #e0e6ff;
      font-weight: 600;
      user-select: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .controls-header:hover {
      background: linear-gradient(135deg, rgba(52, 92, 162, 0.95), rgba(40, 70, 124, 0.95));
    }
    
    .controls-header.collapsed {
      border-radius: 16px;
      border-bottom: none;
    }
    
    .controls-toggle {
      font-size: 1.2rem;
      transition: transform 0.3s ease;
      color: #e0e6ff;
    }
    
    .controls-header.collapsed .controls-toggle {
      transform: rotate(-90deg);
    }
    
    .controls-content {
      overflow: hidden;
      transition: max-height 0.3s ease-out, padding 0.3s ease-out;
      max-height: 1000px;
      padding: 20px;
    }
    
    .controls-content.collapsed {
      max-height: 0;
      padding: 0 20px;
    }
    .control-group {
      margin-bottom: 20px;
    }
    .control-group:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
      color: #e0e6ff;
    }
    
    /* Modern Slider Styling */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
      outline: none;
      margin: 8px 0;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(79, 172, 254, 0.3);
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      transition: all 0.3s ease;
    }
    
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    
    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      transition: all 0.3s ease;
    }
    
    /* Modern Button Styling */
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      font-family: 'Segoe UI', sans-serif;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      margin: 4px 2px;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      background: linear-gradient(135deg, #5a6fd8 0%, #6b42a6 100%);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    #ball-support-widgets {
      position: absolute;
      bottom: 2rem;
      right: 2rem;
      left: 2rem;
      max-height: 40vh;
      overflow-y: auto;
      z-index: 1000;
    }

    @media (max-width: 900px) {
      #ball-support-widgets {
        position: static;
        margin: 2rem auto;
      }
    }
  </style>
</head>
<body>
  <div id="message">לחצו על הכדורים בסדר עולה</div>
  <div id="controls">
    <div class="controls-header" onclick="toggleControls()">
      <span>הגדרות משחק</span>
      <span class="controls-toggle">▼</span>
    </div>
    <div class="controls-content" id="controls-content">
      <div class="control-group">
        <label>קושי:</label>
        <button onclick="setDifficulty(0)">ללא תנועה</button>
        <button onclick="setDifficulty(1.5)">איטי</button>
        <button onclick="setDifficulty(4)">מהיר</button>
      </div>
      <div class="control-group">
        <label for="ballsSlider">מספר כדורים: <span id="ballsLabel">7</span></label>
        <input type="range" id="ballsSlider" min="0" max="3" step="1" value="0">
      </div>
      <div class="control-group">
        <button onclick="initGame()">התחל מחדש</button>
      </div>
      <div class="control-group">
        <label for="fontSize">גודל גופן:</label>
        <input type="range" id="fontSize" min="10" max="50" value="26">
      </div>
      <div class="control-group">
        <label for="redBrightness">בהירות (אדום):</label>
        <input type="range" id="redBrightness" min="0" max="200" value="100">
        <label for="redContrast">ניגודיות (אדום):</label>
        <input type="range" id="redContrast" min="0" max="200" value="100">
      </div>
      <div class="control-group">
        <label id="rightBrightnessLabel" for="rightBrightness">בהירות (ירוק):</label>
        <input type="range" id="rightBrightness" min="0" max="200" value="100">
        <label id="rightContrastLabel" for="rightContrast">ניגודיות (ירוק):</label>
        <input type="range" id="rightContrast" min="0" max="200" value="100">
      </div>
      <div class="control-group">
        <button id="toggleColor">החלף ירוק ↔ כחול</button>
      </div>
    </div>
  </div>
  <div id="ball-support-widgets"></div>
  <canvas id="gameCanvas"></canvas>

  <script>
    const BALL_COUNTS = [7, 14, 21, 35];
    const BALL_RADIUS = 60;
    let SPEED         = 2.5;
    let FONT_SIZE     = 56;

    const canvas = document.getElementById('gameCanvas');
    const ctx    = canvas.getContext('2d');
    const msg    = document.getElementById('message');
    const ballsSlider = document.getElementById('ballsSlider');
    const ballsLabel  = document.getElementById('ballsLabel');
    let balls, nextNumber, numBalls = BALL_COUNTS[ballsSlider.value];
    ballsLabel.textContent = numBalls;

    ballsSlider.addEventListener('input', () => {
      numBalls = BALL_COUNTS[ballsSlider.value];
      ballsLabel.textContent = numBalls;
    });

    ballsSlider.addEventListener('change', initGame);

    const redBrightnessSlider = document.getElementById('redBrightness');
    const redContrastSlider = document.getElementById('redContrast');
    const rightBrightnessSlider = document.getElementById('rightBrightness');
    const rightContrastSlider = document.getElementById('rightContrast');
    const rightBrightnessLabel = document.getElementById('rightBrightnessLabel');
    const rightContrastLabel = document.getElementById('rightContrastLabel');
    const fontSizeSlider = document.getElementById('fontSize');

    let rightColor = 'green';

    function applyColorTransforms(color, brightness, contrast) {
      let r, g, b;
      if (color === 'red') {
        r = 255; g = 0; b = 0;
      } else if (color === 'blue') {
        r = 0; g = 0; b = 255;
    } else {
        r = 0; g = 128; b = 0;
      }

      // Apply brightness
      r = r * (brightness / 100);
      g = g * (brightness / 100);
      b = b * (brightness / 100);

      // Apply contrast
      const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
      r = factor * (r - 128) + 128;
      g = factor * (g - 128) + 128;
      b = factor * (b - 128) + 128;

      r = Math.max(0, Math.min(255, r));
      g = Math.max(0, Math.min(255, g));
      b = Math.max(0, Math.min(255, b));

      return `rgb(${r},${g},${b})`;
    }


    function setDifficulty(newSpeed) {
      SPEED = newSpeed;
      initGame();
    }

    function initGame() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      numBalls = BALL_COUNTS[ballsSlider.value];
      ballsLabel.textContent = numBalls;
      nextNumber = 1;
      msg.textContent = `לחצו על הכדורים בסדר: 1 - ${numBalls}`;

      // Track game start in user counter
      if (window.UserCounter) {
        window.UserCounter.recordGameStart('Ball Game (Tracking)', `${numBalls} balls`);
      }

      const numbers = Array.from({length:numBalls}, (_,i)=>i+1);
      shuffle(numbers);

      balls = numbers.map(n => ({
        num:   n,
        color: Math.random() < 0.5 ? 'red' : 'green',
        x:     Math.random() * (canvas.width  - 2*BALL_RADIUS) + BALL_RADIUS,
        y:     Math.random() * (canvas.height - 2*BALL_RADIUS) + BALL_RADIUS,
        vx:    (Math.random()*2-1) * SPEED,
        vy:    (Math.random()*2-1) * SPEED,
        clicked: false
      }));

      if (!animationFrameId) {
        loop();
      }
    }

    function shuffle(arr) {
      for (let i = arr.length-1; i>0; i--) {
        const j = Math.floor(Math.random() * (i+1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function toggleRightColor() {
      rightColor = rightColor === 'green' ? 'blue' : 'green';
      rightBrightnessLabel.textContent = `בהירות (${rightColor === 'green' ? 'ירוק' : 'כחול'})`;
      rightContrastLabel.textContent = `ניגודיות (${rightColor === 'green' ? 'ירוק' : 'כחול'})`;
      document.getElementById('toggleColor').textContent = rightColor === 'green'
        ? 'החלף ירוק ↔ כחול'
        : 'החלף כחול ↔ ירוק';
      if (!animationFrameId) loop();
    }

    function toggleControls() {
      const header = document.querySelector('.controls-header');
      const content = document.getElementById('controls-content');
      
      header.classList.toggle('collapsed');
      content.classList.toggle('collapsed');
    }

    let animationFrameId;
    function loop() {
      ctx.clearRect(0,0,canvas.width,canvas.height);

      let allClicked = true;
      for (let ball of balls) {
        if (!ball.clicked) {
          allClicked = false;
          ball.x += ball.vx;
          ball.y += ball.vy;

          if (ball.x - BALL_RADIUS < 0 || ball.x + BALL_RADIUS > canvas.width)  ball.vx *= -1;
          if (ball.y - BALL_RADIUS < 0 || ball.y + BALL_RADIUS > canvas.height) ball.vy *= -1;

          ctx.beginPath();
          ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI*2);
          if (ball.color === 'red') {
            ctx.fillStyle = applyColorTransforms('red', redBrightnessSlider.value, redContrastSlider.value);
          } else {
            ctx.fillStyle = applyColorTransforms(rightColor, rightBrightnessSlider.value, rightContrastSlider.value);
          }
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = 'white';
          ctx.font = `${FONT_SIZE}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(ball.num, ball.x, ball.y);
        }
      }

      if (!allClicked) {
        animationFrameId = requestAnimationFrame(loop);
      } else {
        msg.textContent = 'כל הכבוד! סיימת את המשחק 🎉';
        animationFrameId = null;
        
        // Track game completion in user counter
        if (window.UserCounter) {
          window.UserCounter.recordGameCompletion('Ball Game (Tracking)', {
            ballCount: numBalls,
            completed: true
          });
        }
      }
    }

    function handlePointerDown(e) {
      e.preventDefault(); // Prevent default touch behavior
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX || e.touches[0].clientX) - rect.left;
      const my = (e.clientY || e.touches[0].clientY) - rect.top;

      for (let ball of balls) {
        if (!ball.clicked) {
          const dx = mx - ball.x;
          const dy = my - ball.y;
          if (dx * dx + dy * dy <= BALL_RADIUS * BALL_RADIUS) {
            // Auto-collapse settings when user starts playing
            autoCollapseSettings();
            
            if (ball.num === nextNumber) {
              ball.clicked = true;
              nextNumber++;
              if (nextNumber <= numBalls) {
                msg.textContent = `נכון! עכשיו לחצו על: ${nextNumber}`;
              }
            } else {
              alert(`לחצתם על ${ball.num}, אבל הסדר הנכון הוא ${nextNumber}.`);
            }
            break;
          }
        }
      }
    };

    function autoCollapseSettings() {
      const header = document.querySelector('.controls-header');
      const content = document.getElementById('controls-content');
      
      if (!header.classList.contains('collapsed')) {
        header.classList.add('collapsed');
        content.classList.add('collapsed');
      }
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('touchstart', handlePointerDown, { passive: false }); // Added touch support

    
    ['input', 'change'].forEach(eventName => {
        redBrightnessSlider.addEventListener(eventName, () => !animationFrameId && loop());
        redContrastSlider.addEventListener(eventName, () => !animationFrameId && loop());
        rightBrightnessSlider.addEventListener(eventName, () => !animationFrameId && loop());
        rightContrastSlider.addEventListener(eventName, () => !animationFrameId && loop());
        fontSizeSlider.addEventListener(eventName, () => {
            FONT_SIZE = fontSizeSlider.value;
            if (!animationFrameId) loop();
        });
    });

    document.getElementById('toggleColor').addEventListener('click', toggleRightColor);

    window.addEventListener('resize', initGame);

    initGame();
  </script>

  <!-- User Tracking -->
  <script src="src/utils/userCounter.js"></script>
  <script src="scripts/support-widgets.js"></script>
  <script>
    function initBallSupportWidgets() {
      if (typeof renderSupportWidgets === 'function') {
        renderSupportWidgets({ containerId: 'ball-support-widgets', includeNewsletter: true });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initBallSupportWidgets);
    } else {
      initBallSupportWidgets();
    }
  </script>
</body>
</html>
